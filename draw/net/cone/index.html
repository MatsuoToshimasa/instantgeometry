<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>円錐の展開図 | Instant Geometry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="../../../assets/conic-mobile-page.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    .cone-net-side{fill:rgba(42,91,215,.08);stroke:#2a5bd7;stroke-width:3;stroke-linejoin:round}
    .cone-net-base{fill:rgba(42,91,215,.05);stroke:#2a5bd7;stroke-width:3}
    .cone-net-radius{stroke:#2a5bd7;stroke-width:2.4;stroke-linecap:round}
    .cone-net-guide{fill:none;stroke:#687086;stroke-width:2;stroke-linecap:round}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">円錐の展開図</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">半径と母線を入力すると、円錐の展開図を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="円錐の展開図の描画画面"></svg>
    </section>

    <footer class="bottom-bar two-fields">
      <div class="field">
        <div class="field-label">半径</div>
        <input class="field-input" id="radiusInput" type="text" inputmode="decimal" value="3" />
      </div>
      <div class="field">
        <div class="field-label">母線</div>
        <input class="field-input" id="slantInput" type="text" inputmode="decimal" value="6" />
      </div>
    </footer>
  </div>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">x</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">線分</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">x</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=cone-net-labels-1"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=cone-net-labels-1"></script>
  <script src="../../../assets/mobile-angle-ornaments.js?v=cone-net-angle-mark-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=angle-mark-1"></script>
  <script src="../../../assets/net-mobile-page.js?v=angle-mark-1"></script>
  <script>
    window.InstantGeometryNetMobile.createConePage({
      radiusInputId: 'radiusInput',
      slantInputId: 'slantInput',
      fileBase: 'cone-net'
    });
  </script>
  <script src="/assets/site-auto-i18n.js?v=decimal-places-1"></script>
</body>
</html>
