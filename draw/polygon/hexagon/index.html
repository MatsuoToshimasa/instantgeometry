<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>六角形 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <style>
    .bottom-bar.many-fields{
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding-bottom:2px;
      scroll-snap-type:x proximity;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .bottom-bar.many-fields::-webkit-scrollbar{
      display:none;
    }
    .bottom-bar.many-fields .field{
      flex:0 0 112px;
      scroll-snap-align:start;
    }
    .bottom-bar.many-fields .field-label{
      white-space:nowrap;
    }
  </style>
  <script src="/assets/save-quota.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">六角形</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status error" id="statusBox">6辺とAC、AD、AEを入力すると、六角形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="六角形の描画画面"></svg>
    </section>

    <footer class="bottom-bar many-fields">
      <div class="field"><div class="field-label">辺 AB</div><input class="field-input" id="sideABLen" type="text" inputmode="decimal" value="5" /></div>
      <div class="field"><div class="field-label">辺 BC</div><input class="field-input" id="sideBCLen" type="text" inputmode="decimal" value="4.7" /></div>
      <div class="field"><div class="field-label">辺 CD</div><input class="field-input" id="sideCDLen" type="text" inputmode="decimal" value="4.4" /></div>
      <div class="field"><div class="field-label">辺 DE</div><input class="field-input" id="sideDELen" type="text" inputmode="decimal" value="4.2" /></div>
      <div class="field"><div class="field-label">辺 EF</div><input class="field-input" id="sideEFLen" type="text" inputmode="decimal" value="4.5" /></div>
      <div class="field"><div class="field-label">辺 FA</div><input class="field-input" id="sideFALen" type="text" inputmode="decimal" value="5.1" /></div>
      <div class="field"><div class="field-label">線分 AC</div><input class="field-input" id="diagACLen" type="text" inputmode="decimal" value="7.5" /></div>
      <div class="field"><div class="field-label">線分 AD</div><input class="field-input" id="diagADLen" type="text" inputmode="decimal" value="8.3" /></div>
      <div class="field"><div class="field-label">線分 AE</div><input class="field-input" id="diagAELen" type="text" inputmode="decimal" value="8.1" /></div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/function-svg-labels.js?v=polygon-katex-1"></script>
  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/polygon-mobile-page.js"></script>
  <script>
    window.InstantGeometryPolygonMobile.createPage({
      pointIds: ['A', 'B', 'C', 'D', 'E', 'F'],
      sideIds: ['AB', 'BC', 'CD', 'DE', 'EF', 'FA'],
      extraSegmentIds: ['AC', 'AD', 'AE'],
      areaName: '六角形ABCDEF',
      readyMessage: '入力をもとに六角形を描画しています。',
      errorMessage: 'この条件では六角形を作れません。6辺・AC・AD・AE を見直してください。',
      fileBase: 'polygon-hexagon',
      showArea: false,
      controls: [
        { key: 'AB', id: 'sideABLen', label: '辺 AB' },
        { key: 'BC', id: 'sideBCLen', label: '辺 BC' },
        { key: 'CD', id: 'sideCDLen', label: '辺 CD' },
        { key: 'DE', id: 'sideDELen', label: '辺 DE' },
        { key: 'EF', id: 'sideEFLen', label: '辺 EF' },
        { key: 'FA', id: 'sideFALen', label: '辺 FA' },
        { key: 'AC', id: 'diagACLen', label: '線分 AC' },
        { key: 'AD', id: 'diagADLen', label: '線分 AD' },
        { key: 'AE', id: 'diagAELen', label: '線分 AE' }
      ],
      angleNames: {
        A: ['F', 'A', 'B'],
        B: ['A', 'B', 'C'],
        C: ['B', 'C', 'D'],
        D: ['C', 'D', 'E'],
        E: ['D', 'E', 'F'],
        F: ['E', 'F', 'A']
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D', E: 'E', F: 'F' },
        sideInputs: { AB: ' ', BC: ' ', CD: ' ', DE: ' ', EF: ' ', FA: ' ', AC: ' ', AD: ' ', AE: ' ' },
        angleInputs: { A: '', B: '', C: '', D: '', E: '', F: '' },
        extraAreaInputs: { ABC: '', ACD: '', ADE: '', AEF: '' }
      },
      extraAreas: function (context) {
        const points = context.geometry.points;
        function triangleArea(P, Q, R) {
          return Math.abs((P.x * (Q.y - R.y) + Q.x * (R.y - P.y) + R.x * (P.y - Q.y)) / 2);
        }
        function triangleCentroid(P, Q, R) {
          return { x: (P.x + Q.x + R.x) / 3, y: (P.y + Q.y + R.y) / 3 };
        }
        return [
          { id: 'ABC', name: '△ABC', points: [points.A, points.B, points.C], labelPoint: triangleCentroid(points.A, points.B, points.C), value: triangleArea(points.A, points.B, points.C) },
          { id: 'ACD', name: '△ACD', points: [points.A, points.C, points.D], labelPoint: triangleCentroid(points.A, points.C, points.D), value: triangleArea(points.A, points.C, points.D) },
          { id: 'ADE', name: '△ADE', points: [points.A, points.D, points.E], labelPoint: triangleCentroid(points.A, points.D, points.E), value: triangleArea(points.A, points.D, points.E) },
          { id: 'AEF', name: '△AEF', points: [points.A, points.E, points.F], labelPoint: triangleCentroid(points.A, points.E, points.F), value: triangleArea(points.A, points.E, points.F) }
        ];
      }
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
