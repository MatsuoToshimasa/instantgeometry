<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>正N角形② | Instant Geometry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <style>
    .bottom-bar.many-fields{
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding-bottom:2px;
      scroll-snap-type:x proximity;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .bottom-bar.many-fields::-webkit-scrollbar{display:none}
    .bottom-bar.many-fields .field{
      flex:0 0 132px;
      scroll-snap-align:start;
    }
    .bottom-bar.many-fields .field-label{white-space:nowrap}
  </style>
  <script src="../../../assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body data-file-base="regular-polygon-oa" data-ready-message="正N角形②を描画しました。">
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">正N角形②</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">N と OA の長さから正N角形を描画しています。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="正N角形②の描画画面"></svg>
    </section>

    <footer class="bottom-bar many-fields">
      <div class="field"><div class="field-label">N（5以上の自然数）</div><input class="field-input" id="vertexCount" type="text" inputmode="numeric" pattern="[0-9]*" value="6" /></div>
      <div class="field"><div class="field-label">OAの長さ</div><input class="field-input" id="radiusLen" type="text" inputmode="decimal" value="5" /></div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/mobile-angle-ornaments.js?v=segment-modal-1"></script>
  <script src="../../../assets/draw-shared-labels.js?v=regular-controller-1"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=regular-controller-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=regular-controller-1"></script>
  <script src="../../../assets/draw-regular-polygon-page.js?v=regular-move-2"></script>
  <script src="../../../assets/site-auto-i18n.js"></script>
</body>
</html>
