<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>星形 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <style>
    .bottom-bar.many-fields{
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding-bottom:2px;
      scroll-snap-type:x proximity;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .bottom-bar.many-fields::-webkit-scrollbar{display:none}
    .bottom-bar.many-fields .field{
      flex:0 0 112px;
      scroll-snap-align:start;
    }
    .bottom-bar.many-fields .field-label{white-space:nowrap}
  </style>
  <script src="/assets/save-quota.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">星形</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status error" id="statusBox">5つの先端角を入力すると、星形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="星形の描画画面"></svg>
    </section>

    <footer class="bottom-bar many-fields">
      <div class="field"><div class="field-label">角 A</div><input class="field-input" id="angleAInput" type="text" inputmode="decimal" value="20" /></div>
      <div class="field"><div class="field-label">角 B</div><input class="field-input" id="angleBInput" type="text" inputmode="decimal" value="30" /></div>
      <div class="field"><div class="field-label">角 C</div><input class="field-input" id="angleCInput" type="text" inputmode="decimal" value="40" /></div>
      <div class="field"><div class="field-label">角 D</div><input class="field-input" id="angleDInput" type="text" inputmode="decimal" value="40" /></div>
      <div class="field"><div class="field-label">角 E</div><input class="field-input" id="angleEInput" type="text" inputmode="decimal" value="50" /></div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/function-svg-labels.js?v=polygon-katex-1"></script>
  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/polygon-mobile-page.js"></script>
  <script>
    window.InstantGeometryPolygonMobile.createPage({
      mode: 'star-angles',
      normalizeMinSide: 5,
      pointIds: ['A', 'B', 'C', 'D', 'E'],
      drawOrder: ['A', 'C', 'E', 'B', 'D'],
      sideIds: ['AC', 'CE', 'EB', 'BD', 'DA'],
      areaName: '星形ABCDE',
      readyMessage: '入力をもとに星形を描画しています。',
      errorMessage: 'この角の組み合わせでは星形を作れません。',
      fileBase: 'polygon-star',
      controls: [
        { key: 'A', id: 'angleAInput', label: '角 A' },
        { key: 'B', id: 'angleBInput', label: '角 B' },
        { key: 'C', id: 'angleCInput', label: '角 C' },
        { key: 'D', id: 'angleDInput', label: '角 D' },
        { key: 'E', id: 'angleEInput', label: '角 E' }
      ],
      angleNames: {
        A: ['D', 'A', 'C'],
        B: ['E', 'B', 'D'],
        C: ['A', 'C', 'E'],
        D: ['B', 'D', 'A'],
        E: ['C', 'E', 'B']
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D', E: 'E' },
        sideInputs: { AC: '', CE: '', EB: '', BD: '', DA: '' },
        angleInputs: { A: ' ', B: ' ', C: ' ', D: ' ', E: ' ' },
        areaValue: '',
        sideArcVisible: { AC: false, CE: false, EB: false, BD: false, DA: false },
        sideKinds: { AC: 'plain', CE: 'plain', EB: 'plain', BD: 'plain', DA: 'plain' },
        angleKinds: { A: 'plain', B: 'plain', C: 'plain', D: 'plain', E: 'plain' }
      }
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
