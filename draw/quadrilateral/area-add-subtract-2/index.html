<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>面積足し引き② | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">面積足し引き②</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">AB、EC、CD、FA から、角Bと角Dが直角の四角形を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="面積足し引き②の描画画面"></svg>
    </section>

    <footer class="bottom-bar four-fields">
      <div class="field">
        <div class="field-label">AB</div>
        <input class="field-input" id="abInput" type="text" inputmode="decimal" value="5" />
      </div>
      <div class="field">
        <div class="field-label">EC</div>
        <input class="field-input" id="ecInput" type="text" inputmode="decimal" value="3" />
      </div>
      <div class="field">
        <div class="field-label">CD</div>
        <input class="field-input" id="cdInput" type="text" inputmode="decimal" value="3" />
      </div>
      <div class="field">
        <div class="field-label">FA</div>
        <input class="field-input" id="faInput" type="text" inputmode="decimal" value="2.5" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    (function () {
      'use strict';

      function midpoint(P, Q) {
        return { x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2 };
      }

      function pointOnSegment(P, Q, distance) {
        const length = Math.hypot(Q.x - P.x, Q.y - P.y) || 1;
        const t = distance / length;
        return {
          x: P.x + (Q.x - P.x) * t,
          y: P.y + (Q.y - P.y) * t
        };
      }

      function polygonArea(points) {
        let sum = 0;
        for (let i = 0; i < points.length; i += 1) {
          const p = points[i];
          const q = points[(i + 1) % points.length];
          sum += p.x * q.y - q.x * p.y;
        }
        return Math.abs(sum) / 2;
      }

      function buildGeometry(values, helpers) {
        const a = values.AB;
        const e = values.EC;
        const c = values.CD;
        const f = values.FA;
        let best = null;
        for (let deg = 46; deg <= 84; deg += 0.25) {
          const phi = deg * Math.PI / 180;
          const sin = Math.sin(phi);
          const cos = Math.cos(phi);
          if (!(a * sin > c)) continue;
          const bc = (a * sin - c) / cos;
          const D = { x: bc + c * cos, y: c * sin };
          const ad = Math.hypot(D.x, a - D.y);
          if (!(bc > e * 1.08)) continue;
          if (!(D.y > 0 && D.y < a * 0.96)) continue;
          if (!(ad > f * 1.06)) continue;
          const target = 68;
          const score = Math.abs(deg - target) + Math.abs(bc / Math.max(1, a) - 0.95) * 7;
          if (!best || score < best.score) best = { phi: phi, ad: ad, bc: bc, D: D, score: score };
        }
        if (!best) {
          throw new Error('この値では点Eまたは点Fが辺の外に出ます。EC と FA を小さくするか、AB を大きくしてください。');
        }
        const A = { x: 0, y: a };
        const B = { x: 0, y: 0 };
        const C = { x: best.bc, y: 0 };
        const D = best.D;
        const E = { x: C.x - e, y: 0 };
        const F = pointOnSegment(A, D, f);
        const geometry = helpers.finalizeGeometry({ A: A, B: B, C: C, D: D });
        geometry.E = E;
        geometry.F = F;
        geometry.values = { AB: a, EC: e, CD: c, FA: f, AD: best.ad };
        return geometry;
      }

      function drawLine(helpers, P, Q, attrs) {
        const p = helpers.fitPoint(P);
        const q = helpers.fitPoint(Q);
        const line = helpers.createSvg('line', Object.assign({
          x1: p.x,
          y1: p.y,
          x2: q.x,
          y2: q.y,
          stroke: '#2a5bd7',
          'stroke-width': '3',
          'stroke-linecap': 'round'
        }, attrs || {}));
        helpers.stage.appendChild(line);
        return { p: p, q: q };
      }

      function drawPointLabel(helpers, id, point, dx, dy) {
        const p = helpers.fitPoint(point);
        helpers.stage.appendChild(helpers.createSvg('circle', { cx: p.x, cy: p.y, r: 7, fill: '#1f2430' }));
        const label = helpers.getPointLabelValue(id);
        if (!label) return;
        const text = helpers.createLabelNode(label, {
          x: p.x + dx,
          y: p.y + dy,
          'text-anchor': 'middle',
          'dominant-baseline': 'middle',
          'font-size': '46',
          'font-weight': '700',
          fill: '#1f2430'
        });
        helpers.stage.appendChild(text);
      }

      function drawSegmentLabel(helpers, label, P, Q, dx, dy) {
        const p = helpers.fitPoint(P);
        const q = helpers.fitPoint(Q);
        const m = midpoint(p, q);
        const text = helpers.createLabelNode(label, {
          x: m.x + dx,
          y: m.y + dy,
          'text-anchor': 'middle',
          'dominant-baseline': 'middle',
          'font-size': '46',
          'font-weight': '700',
          fill: '#2a5bd7'
        });
        helpers.stage.appendChild(text);
      }

      window.InstantGeometryQuadrilateralMobile.createPage({
        readyMessage: 'AB、EC、CD、FA から面積足し引き②を描画しました。',
        fileBase: 'area-add-subtract-2',
        showArea: false,
        controlInputIds: {
          AB: 'abInput',
          EC: 'ecInput',
          CD: 'cdInput',
          FA: 'faInput'
        },
        initialState: {
          pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D', E: 'E', F: 'F' },
          sides: { AB: 5, BC: 6, CD: 3, DA: 5 },
          sideInputs: { AB: ' ', BC: '', CD: ' ', DA: '' },
          sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain' },
          sideArcVisible: { AB: true, BC: true, CD: true, DA: true },
          angleInputs: { A: '', B: '', C: '', D: '' },
          angleKinds: { A: 'hidden', B: 'right', C: 'hidden', D: 'right' },
          areaValue: '',
          extraAreaInputs: { ABE: '', ECFA: '', CDF: '' },
          extraAreaColors: { ABE: '#ffffff', ECFA: '#2a5bd7', CDF: '#ffffff' }
        },
        readControls: function (inputs, parsePositiveNumber) {
          return {
            AB: parsePositiveNumber(inputs.AB.value, 'AB'),
            EC: parsePositiveNumber(inputs.EC.value, 'EC'),
            CD: parsePositiveNumber(inputs.CD.value, 'CD'),
            FA: parsePositiveNumber(inputs.FA.value, 'FA')
          };
        },
        applyControlsToState: function (state, parsed) {
          state.sides.AB = parsed.AB;
          state.sides.CD = parsed.CD;
        },
        computeGeometry: function (state, parsed, helpers) {
          const geometry = buildGeometry(parsed, helpers);
          state.sides.BC = geometry.sides.BC;
          state.sides.DA = geometry.sides.DA;
          return geometry;
        },
        extraAreas: function (context) {
          const g = context.geometry;
          return [
            { id: 'ABE', name: '△ABE', points: [g.A, g.B, g.E], color: '#ffffff', value: polygonArea([g.A, g.B, g.E]) },
            { id: 'ECFA', name: '四角形ECFA', points: [g.E, g.C, g.F, g.A], color: '#2a5bd7', value: polygonArea([g.E, g.C, g.F, g.A]) },
            { id: 'CDF', name: '△CDF', points: [g.C, g.D, g.F], color: '#ffffff', value: polygonArea([g.C, g.D, g.F]) }
          ];
        },
        drawAuxiliary: function (helpers) {
          const g = helpers.geometry;
          drawLine(helpers, g.A, g.E);
          drawLine(helpers, g.C, g.F);
          drawPointLabel(helpers, 'E', g.E, 0, 44);
          drawPointLabel(helpers, 'F', g.F, 0, -42);
          drawSegmentLabel(helpers, helpers.state.sideDisplay && helpers.state.sideDisplay.EC ? helpers.state.sideDisplay.EC : String(g.values.EC), g.E, g.C, 0, 44);
          drawSegmentLabel(helpers, helpers.state.sideDisplay && helpers.state.sideDisplay.FA ? helpers.state.sideDisplay.FA : String(g.values.FA), g.F, g.A, -24, -30);
        },
        sideNumericMode: function (id) {
          return id === 'AB' || id === 'CD' ? 'control' : 'readonly';
        },
        angleNumericMode: function () {
          return 'readonly';
        },
        updateSideControl: function (id, value, state, inputs) {
          if (id === 'AB') {
            inputs.AB.value = String(value);
            state.sides.AB = value;
          } else if (id === 'CD') {
            inputs.CD.value = String(value);
            state.sides.CD = value;
          }
        },
        updateAngleControl: function () {}
      });
    })();
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
