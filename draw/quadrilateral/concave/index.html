<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>凹四角形と内角和 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">凹四角形と内角和</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status error" id="statusBox">4つの内角を入力すると、凹四角形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="凹四角形と内角和の描画画面"></svg>
    </section>

    <footer class="bottom-bar">
      <div class="field">
        <div class="field-label">角A</div>
        <input class="field-input" id="angleAInput" type="text" inputmode="decimal" value="65" />
      </div>
      <div class="field">
        <div class="field-label">角B</div>
        <input class="field-input" id="angleBInput" type="text" inputmode="decimal" value="65" />
      </div>
      <div class="field">
        <div class="field-label">角C</div>
        <input class="field-input" id="angleCInput" type="text" inputmode="decimal" value="210" />
      </div>
      <div class="field">
        <div class="field-label">角D</div>
        <input class="field-input" id="angleDInput" type="text" inputmode="decimal" value="20" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    window.InstantGeometryQuadrilateralMobile.createPage({
      readyMessage: '入力をもとに凹四角形を描画しています。',
      fileBase: 'quadrilateral-concave-angles',
      angleArcRadius: 0.24,
      angleHitArcRadius: 0.56,
      controlInputIds: {
        A: 'angleAInput',
        B: 'angleBInput',
        C: 'angleCInput',
        D: 'angleDInput'
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D' },
        sides: { AB: 0, BC: 0, CD: 0, DA: 0 },
        sideInputs: { AB: '', BC: '', CD: '', DA: '' },
        sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain' },
        sideArcVisible: { AB: false, BC: false, CD: false, DA: false },
        angleInputs: { A: ' ', B: ' ', C: ' ', D: ' ' },
        angleDisplay: { A: '65°', B: '65°', C: '210°', D: '20°' },
        angleKinds: { A: 'plain', B: 'plain', C: 'plain', D: 'plain' },
        areaValue: ''
      },
      readControls: function (inputs, parsePositiveNumber) {
        const parsed = {
          A: parsePositiveNumber(inputs.A.value, '角A'),
          B: parsePositiveNumber(inputs.B.value, '角B'),
          C: parsePositiveNumber(inputs.C.value, '角C'),
          D: parsePositiveNumber(inputs.D.value, '角D')
        };
        Object.keys(parsed).forEach(function (id) {
          if (!(parsed[id] > 0 && parsed[id] < 360)) {
            throw new Error('角' + id + 'を 0° より大きく 360° 未満で入力してください。');
          }
        });
        const total = parsed.A + parsed.B + parsed.C + parsed.D;
        if (Math.abs(total - 360) > 1e-6) {
          throw new Error('4つの内角の合計は 360° にしてください。');
        }
        const reflexCount = Object.keys(parsed).filter(function (id) { return parsed[id] > 180; }).length;
        if (reflexCount !== 1) {
          throw new Error('凹四角形では 180° を超える角を1つ入力してください。');
        }
        return parsed;
      },
      applyControlsToState: function (state, parsed) {
        state.angleDisplay = {
          A: parsed.A + '°',
          B: parsed.B + '°',
          C: parsed.C + '°',
          D: parsed.D + '°'
        };
      },
      computeGeometry: function (state, parsed, helpers) {
        return helpers.finalizeGeometry(helpers.scalePointsToMinSide(helpers.buildQuadrilateralFromAngles(parsed), 5));
      },
      sideNumericMode: function () {
        return 'readonly';
      },
      angleNumericMode: function () {
        return 'control';
      },
      updateSideControl: function () {},
      updateAngleControl: function (id, value, state, inputs) {
        if (inputs[id]) inputs[id].value = String(value);
        state.angleDisplay[id] = value + '°';
      }
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
