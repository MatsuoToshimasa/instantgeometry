<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>四角形と外接円 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">四角形と外接円</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">角Aと角Bを入力すると、同一円周上の四角形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="四角形と外接円の描画画面"></svg>
    </section>

    <footer class="bottom-bar">
      <div class="field">
        <div class="field-label">角A</div>
        <input class="field-input" id="angleAInput" type="text" inputmode="decimal" value="80" />
      </div>
      <div class="field">
        <div class="field-label">角B</div>
        <input class="field-input" id="angleBInput" type="text" inputmode="decimal" value="100" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    function pointOnCircle(degrees) {
      const radians = degrees * Math.PI / 180;
      return { x: Math.cos(radians), y: Math.sin(radians) };
    }

    function buildCyclicQuadrilateral(angleA, angleB) {
      const lower = Math.max(0.0001, 2 * angleA + 2 * angleB - 360 + 0.0001);
      const upper = Math.min(2 * angleA, 2 * angleB) - 0.0001;
      if (!(lower < upper)) {
        throw new Error('この角の組み合わせでは四角形を作れません。');
      }
      const arcCD = (lower + upper) / 2;
      const arcBC = 2 * angleA - arcCD;
      const arcDA = 2 * angleB - arcCD;
      const arcAB = 360 - arcBC - arcCD - arcDA;
      if ([arcAB, arcBC, arcCD, arcDA].some(function (arc) { return !(arc > 0); })) {
        throw new Error('この角の組み合わせでは四角形を作れません。');
      }

      const angleOfA = -90 - arcAB / 2;
      const angleOfB = angleOfA + arcAB;
      const angleOfC = angleOfB + arcBC;
      const angleOfD = angleOfC + arcCD;
      return {
        A: pointOnCircle(angleOfA),
        B: pointOnCircle(angleOfB),
        C: pointOnCircle(angleOfC),
        D: pointOnCircle(angleOfD)
      };
    }

    window.InstantGeometryQuadrilateralMobile.createPage({
      readyMessage: '入力をもとに四角形と外接円を描画しています。',
      fileBase: 'quadrilateral-cyclic',
      angleArcRadius: 0.22,
      angleHitArcRadius: 0.52,
      controlInputIds: {
        A: 'angleAInput',
        B: 'angleBInput'
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D' },
        sides: { AB: 0, BC: 0, CD: 0, DA: 0 },
        sideInputs: { AB: '', BC: '', CD: '', DA: '' },
        sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain' },
        sideArcVisible: { AB: false, BC: false, CD: false, DA: false },
        angleInputs: { A: ' ', B: ' ', C: '', D: '' },
        angleDisplay: { A: '80°', B: '100°', C: '100°', D: '80°' },
        angleKinds: { A: 'plain', B: 'plain', C: 'hidden', D: 'hidden' },
        areaValue: ''
      },
      readControls: function (inputs, parsePositiveNumber) {
        const parsed = {
          A: parsePositiveNumber(inputs.A.value, '角A'),
          B: parsePositiveNumber(inputs.B.value, '角B')
        };
        ['A', 'B'].forEach(function (id) {
          if (!(parsed[id] > 0 && parsed[id] < 180)) {
            throw new Error('角' + id + 'は 0° より大きく 180° 未満で入力してください。');
          }
        });
        return parsed;
      },
      applyControlsToState: function (state, parsed) {
        state.angleDisplay = {
          A: parsed.A + '°',
          B: parsed.B + '°',
          C: (180 - parsed.A) + '°',
          D: (180 - parsed.B) + '°'
        };
      },
      computeGeometry: function (state, parsed, helpers) {
        const points = helpers.scalePointsToMinSide(buildCyclicQuadrilateral(parsed.A, parsed.B), 5);
        const geometry = helpers.finalizeGeometry(points);
        geometry.circumcircle = {
          center: { x: 0, y: 0 },
          radius: Math.hypot(points.A.x, points.A.y)
        };
        return geometry;
      },
      drawAuxiliary: function (ctx) {
        if (!ctx.geometry.circumcircle) return;
        const center = ctx.fitPoint(ctx.geometry.circumcircle.center);
        const circle = ctx.createSvg('circle', {
          cx: center.x,
          cy: center.y,
          r: ctx.geometry.circumcircle.radius * ctx.view.scale,
          fill: '#eef4ff',
          'fill-opacity': '0.24',
          stroke: '#274fb5',
          'stroke-width': '4'
        });
        ctx.stage.insertBefore(circle, ctx.stage.firstChild);
      },
      sideNumericMode: function () {
        return 'readonly';
      },
      angleNumericMode: function () {
        return 'readonly';
      },
      updateSideControl: function () {},
      updateAngleControl: function () {}
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
