<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>四角形と外角和 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">四角形と外角和</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">∠EAD、∠FBA、∠GCB、∠HDC を外角として描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="四角形と外角和の描画画面"></svg>
    </section>

    <footer class="bottom-bar four-fields">
      <div class="field">
        <div class="field-label">∠EAD</div>
        <input class="field-input" id="angleEADInput" type="text" inputmode="decimal" value="75" />
      </div>
      <div class="field">
        <div class="field-label">∠FBA</div>
        <input class="field-input" id="angleFBAInput" type="text" inputmode="decimal" value="105" />
      </div>
      <div class="field">
        <div class="field-label">∠GCB</div>
        <input class="field-input" id="angleGCBInput" type="text" inputmode="decimal" value="70" />
      </div>
      <div class="field">
        <div class="field-label">∠HDC</div>
        <input class="field-input" id="angleHDCInput" type="text" inputmode="decimal" value="110" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    function angleBetween(prev, vertex, next) {
      const ux = prev.x - vertex.x;
      const uy = prev.y - vertex.y;
      const vx = next.x - vertex.x;
      const vy = next.y - vertex.y;
      const denom = (Math.hypot(ux, uy) || 1) * (Math.hypot(vx, vy) || 1);
      const cosine = Math.max(-1, Math.min(1, (ux * vx + uy * vy) / denom));
      return Math.acos(cosine) * 180 / Math.PI;
    }

    function pointOnRay(P, Q, distance) {
      const dx = Q.x - P.x;
      const dy = Q.y - P.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: P.x + dx / len * distance, y: P.y + dy / len * distance };
    }

    function extensionPoints(geometry) {
      const ext = 2.1;
      return {
        E: pointOnRay(geometry.A, geometry.B, -ext),
        F: pointOnRay(geometry.B, geometry.C, -ext),
        G: pointOnRay(geometry.C, geometry.D, -ext),
        H: pointOnRay(geometry.D, geometry.A, -ext)
      };
    }

    function exteriorLabelPoint(vertex, p1, p2) {
      return {
        x: vertex.x + (p1.x - vertex.x) * 0.34 + (p2.x - vertex.x) * 0.2,
        y: vertex.y + (p1.y - vertex.y) * 0.34 + (p2.y - vertex.y) * 0.2
      };
    }

    function orientBase(points) {
      const angle = Math.atan2(points.B.y - points.A.y, points.B.x - points.A.x);
      const cos = Math.cos(-angle);
      const sin = Math.sin(-angle);
      const rotated = {};
      ['A', 'B', 'C', 'D'].forEach(function (id) {
        const point = points[id];
        rotated[id] = {
          x: point.x * cos - point.y * sin,
          y: -(point.x * sin + point.y * cos)
        };
      });
      const upperY = (rotated.C.y + rotated.D.y) / 2;
      const lowerY = (rotated.A.y + rotated.B.y) / 2;
      if (upperY > lowerY) {
        ['A', 'B', 'C', 'D'].forEach(function (id) {
          rotated[id].y *= -1;
        });
      }
      return rotated;
    }

    window.InstantGeometryQuadrilateralMobile.createPage({
      readyMessage: '∠EAD、∠FBA、∠GCB、∠HDC を外角として描画しました。',
      fileBase: 'quadrilateral-exterior-angle-sum',
      angleArcRadius: 0.26,
      angleHitArcRadius: 0.62,
      controlInputIds: {
        EAD: 'angleEADInput',
        FBA: 'angleFBAInput',
        GCB: 'angleGCBInput',
        HDC: 'angleHDCInput'
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D', E: '', F: '', G: '', H: '' },
        sides: { AB: 0, BC: 0, CD: 0, DA: 0 },
        sideInputs: { AB: '', BC: '', CD: '', DA: '' },
        sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain' },
        sideArcVisible: { AB: false, BC: false, CD: false, DA: false },
        angleInputs: { A: '', B: '', C: '', D: '' },
        angleDisplay: { A: '105°', B: '75°', C: '110°', D: '70°' },
        angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden', D: 'hidden' },
        extraAngleInputs: { EAD: ' ', FBA: ' ', GCB: ' ', HDC: ' ' },
        extraAngleKinds: { EAD: 'plain', FBA: 'plain', GCB: 'plain', HDC: 'plain' },
        areaValue: ''
      },
      readControls: function (inputs, parsePositiveNumber) {
        const parsed = {
          EAD: parsePositiveNumber(inputs.EAD.value, '∠EAD'),
          FBA: parsePositiveNumber(inputs.FBA.value, '∠FBA'),
          GCB: parsePositiveNumber(inputs.GCB.value, '∠GCB'),
          HDC: parsePositiveNumber(inputs.HDC.value, '∠HDC')
        };
        Object.keys(parsed).forEach(function (id) {
          if (!(parsed[id] > 0 && parsed[id] < 180)) {
            throw new Error('∠' + id + 'を 0° より大きく 180° 未満で入力してください。');
          }
        });
        const sum = parsed.EAD + parsed.FBA + parsed.GCB + parsed.HDC;
        if (Math.abs(sum - 360) > 0.01) {
          throw new Error('∠EAD + ∠FBA + ∠GCB + ∠HDC が 360° になるように入力してください。現在は ' + Math.round(sum * 100) / 100 + '° です。');
        }
        parsed.A = 180 - parsed.EAD;
        parsed.B = 180 - parsed.FBA;
        parsed.C = 180 - parsed.GCB;
        parsed.D = 180 - parsed.HDC;
        return parsed;
      },
      applyControlsToState: function (state, parsed) {
        state.angleDisplay = {
          A: parsed.A + '°',
          B: parsed.B + '°',
          C: parsed.C + '°',
          D: parsed.D + '°'
        };
      },
      computeGeometry: function (state, parsed, helpers) {
        const points = helpers.buildQuadrilateralFromAngles({
          A: parsed.A,
          B: parsed.B,
          C: parsed.C,
          D: parsed.D
        });
        return helpers.finalizeGeometry(helpers.scalePointsToMinSide(orientBase(points), 5));
      },
      extraAngles: function (context) {
        const geometry = context.geometry;
        const ext = extensionPoints(geometry);
        return [
          {
            id: 'EAD',
            name: '∠EAD',
            value: angleBetween(ext.E, geometry.A, geometry.D),
            vertex: geometry.A,
            p1: ext.E,
            p2: geometry.D,
            labelPoint: exteriorLabelPoint(geometry.A, ext.E, geometry.D)
          },
          {
            id: 'FBA',
            name: '∠FBA',
            value: angleBetween(ext.F, geometry.B, geometry.A),
            vertex: geometry.B,
            p1: ext.F,
            p2: geometry.A,
            labelPoint: exteriorLabelPoint(geometry.B, ext.F, geometry.A)
          },
          {
            id: 'GCB',
            name: '∠GCB',
            value: angleBetween(ext.G, geometry.C, geometry.B),
            vertex: geometry.C,
            p1: ext.G,
            p2: geometry.B,
            labelPoint: exteriorLabelPoint(geometry.C, ext.G, geometry.B)
          },
          {
            id: 'HDC',
            name: '∠HDC',
            value: angleBetween(ext.H, geometry.D, geometry.C),
            vertex: geometry.D,
            p1: ext.H,
            p2: geometry.C,
            labelPoint: exteriorLabelPoint(geometry.D, ext.H, geometry.C)
          }
        ];
      },
      drawAuxiliary: function (ctx) {
        const ext = extensionPoints(ctx.geometry);
        [
          { id: 'E', vertex: 'A', point: ext.E, labelOffset: { x: -42, y: 28 } },
          { id: 'F', vertex: 'B', point: ext.F, labelOffset: { x: 42, y: 28 } },
          { id: 'G', vertex: 'C', point: ext.G, labelOffset: { x: 42, y: -28 } },
          { id: 'H', vertex: 'D', point: ext.H, labelOffset: { x: -42, y: -28 } }
        ].forEach(function (item) {
          const tV = ctx.screen[item.vertex];
          const tP = ctx.fitPoint(item.point);
          ctx.stage.appendChild(ctx.createSvg('line', {
            x1: tV.x,
            y1: tV.y,
            x2: tP.x,
            y2: tP.y,
            stroke: '#7f8aa3',
            'stroke-width': '3',
            'stroke-linecap': 'round',
            'stroke-dasharray': '9 7'
          }));
          const label = ctx.getPointLabelValue(item.id);
          const pointNode = ctx.createSvg('circle', {
            cx: tP.x,
            cy: tP.y,
            r: label ? 8 : 18,
            fill: label ? '#1f2430' : 'transparent'
          });
          ctx.attachHit(pointNode, 'point', item.id);
          ctx.stage.appendChild(pointNode);
          if (label) {
            const labelNode = ctx.createLabelNode(label, {
              x: tP.x + item.labelOffset.x,
              y: tP.y + item.labelOffset.y,
              'text-anchor': 'middle',
              'dominant-baseline': 'middle',
              'font-size': '60',
              'font-weight': '700',
              fill: '#1f2430'
            });
            ctx.attachHit(labelNode, 'point', item.id);
            ctx.stage.appendChild(labelNode);
          }
        });
      },
      sideNumericMode: function () {
        return 'readonly';
      },
      angleNumericMode: function () {
        return 'readonly';
      },
      updateSideControl: function () {},
      updateAngleControl: function () {}
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
