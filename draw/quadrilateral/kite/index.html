<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>凧形 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">凧形</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status error" id="statusBox">横幅・上の高さ・下の高さを入力すると、凧形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="凧形の描画画面"></svg>
    </section>

    <footer class="bottom-bar">
      <div class="field">
        <div class="field-label">横幅</div>
        <input class="field-input" id="widthInput" type="text" inputmode="decimal" value="6" />
      </div>
      <div class="field">
        <div class="field-label">上の高さ</div>
        <input class="field-input" id="upperHeightInput" type="text" inputmode="decimal" value="4" />
      </div>
      <div class="field">
        <div class="field-label">下の高さ</div>
        <input class="field-input" id="lowerHeightInput" type="text" inputmode="decimal" value="6" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    window.InstantGeometryQuadrilateralMobile.createPage({
      readyMessage: '入力をもとに凧形を描画しています。',
      fileBase: 'quadrilateral-kite',
      showArea: false,
      useRootSideLabels: true,
      controlInputIds: {
        width: 'widthInput',
        upperHeight: 'upperHeightInput',
        lowerHeight: 'lowerHeightInput'
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D', O: '' },
        sides: { AB: 0, BC: 0, CD: 0, DA: 0, AO: 4, CO: 6, BD: 6 },
        sideInputs: { AB: '', BC: '', CD: '', DA: '', AO: ' ', CO: ' ', BD: ' ' },
        sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain', AO: 'plain', CO: 'plain', BD: 'plain' },
        sideArcVisible: { AB: false, BC: false, CD: false, DA: false, AO: true, CO: true, BD: true },
        angleInputs: { A: '', B: '', C: '', D: '' },
        angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden', D: 'hidden' }
      },
      readControls: function (inputs, parsePositiveNumber) {
        return {
          width: parsePositiveNumber(inputs.width.value, '横幅'),
          upperHeight: parsePositiveNumber(inputs.upperHeight.value, '上の高さ'),
          lowerHeight: parsePositiveNumber(inputs.lowerHeight.value, '下の高さ')
        };
      },
      applyControlsToState: function () {},
      computeGeometry: function (state, parsed, helpers) {
        return helpers.finalizeGeometry({
          A: { x: 0, y: parsed.upperHeight },
          B: { x: -parsed.width / 2, y: 0 },
          C: { x: 0, y: -parsed.lowerHeight },
          D: { x: parsed.width / 2, y: 0 }
        });
      },
      sideNumericMode: function () {
        return 'readonly';
      },
      angleNumericMode: function () {
        return 'readonly';
      },
      drawAuxiliary: function (helpers) {
        const state = helpers.state;
        const geometry = helpers.geometry;
        const screen = helpers.screen;
        const createSvg = helpers.createSvg;
        const stage = helpers.stage;
        const attachHit = helpers.attachHit;
        const O = {
          x: (geometry.B.x + geometry.D.x) / 2,
          y: (geometry.B.y + geometry.D.y) / 2
        };
        const tO = helpers.fitPoint(O);
        state.sides.AO = helpers.formatLengthBetween(geometry.A, O);
        state.sides.CO = helpers.formatLengthBetween(geometry.C, O);
        state.sides.BD = helpers.formatLengthBetween(geometry.B, geometry.D);
        state.sideDisplay = state.sideDisplay || {};
        state.sideDisplay.AO = state.sides.AO;
        state.sideDisplay.CO = state.sides.CO;
        state.sideDisplay.BD = state.sides.BD;

        function line(from, to) {
          const node = createSvg('line', {
            x1: from.x,
            y1: from.y,
            x2: to.x,
            y2: to.y,
            fill: 'none',
            stroke: '#2a5bd7',
            'stroke-width': '2.4',
            'stroke-linecap': 'round',
            'stroke-dasharray': '8 8'
          });
          stage.appendChild(node);
        }

        function hitLine(from, to, id) {
          const hit = createSvg('line', {
            x1: from.x,
            y1: from.y,
            x2: to.x,
            y2: to.y,
            stroke: 'transparent',
            'stroke-width': '28',
            'stroke-linecap': 'round'
          });
          attachHit(hit, 'side', id);
          stage.appendChild(hit);
        }

        function label(from, to, id, dx, dy) {
          const text = helpers.getSideLabelValue(id);
          if (!text) return;
          const labelPoint = {
            x: (from.x + to.x) / 2 + dx,
            y: (from.y + to.y) / 2 + dy
          };
          if (state.sideArcVisible[id] !== false && helpers.sideArcGeometry && helpers.quadraticPathSegment) {
            const geom = helpers.sideArcGeometry(from, to, helpers.screen.center, labelPoint);
            stage.appendChild(createSvg('path', {
              d: helpers.quadraticPathSegment(from, geom.control, to, 0, 0.5 - geom.gapHalf, 20),
              fill: 'none',
              stroke: '#2a5bd7',
              'stroke-width': '2',
              'stroke-linecap': 'round',
              'stroke-dasharray': '6 5'
            }));
            stage.appendChild(createSvg('path', {
              d: helpers.quadraticPathSegment(from, geom.control, to, 0.5 + geom.gapHalf, 1, 20),
              fill: 'none',
              stroke: '#2a5bd7',
              'stroke-width': '2',
              'stroke-linecap': 'round',
              'stroke-dasharray': '6 5'
            }));
          }
          if (helpers.drawSideKind) helpers.drawSideKind(state.sideKinds[id], from, to);
          const labelAttrs = {
            x: labelPoint.x,
            y: labelPoint.y,
            'text-anchor': 'middle',
            'dominant-baseline': 'middle',
            'font-size': '56',
            'font-weight': '700',
            fill: '#2a5bd7'
          };
          const node = helpers.createLabelNode ? helpers.createLabelNode(text, labelAttrs) : createSvg('text', labelAttrs);
          if (!helpers.createLabelNode) node.textContent = text;
          attachHit(node, 'side', id);
          stage.appendChild(node);
        }

        line(screen.A, screen.C);
        line(screen.B, screen.D);
        hitLine(screen.A, tO, 'AO');
        hitLine(screen.C, tO, 'CO');
        hitLine(screen.B, screen.D, 'BD');
        if (state.pointInputs.O) {
          stage.appendChild(createSvg('circle', { cx: tO.x, cy: tO.y, r: 7, fill: '#1f2430' }));
          const oLabel = createSvg('text', {
            x: tO.x + 26,
            y: tO.y - 26,
            'text-anchor': 'middle',
            'dominant-baseline': 'middle',
            'font-size': '52',
            'font-weight': '700',
            fill: '#1f2430'
          });
          oLabel.textContent = state.pointInputs.O;
          stage.appendChild(oLabel);
        }
        label(screen.A, tO, 'AO', -34, 0);
        label(screen.C, tO, 'CO', 34, 0);
        label(screen.B, screen.D, 'BD', 0, -34);
      },
      updateSideControl: function () {},
      updateAngleControl: function () {}
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
