<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>中点連結定理⑥ | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">中点連結定理⑥</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">AG、AB、BF を入力すると、AB=CD で G, F, E がそれぞれ AD, BC, BD の中点となる凸四角形 ABCD を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="中点連結定理⑥の描画画面"></svg>
    </section>

    <footer class="bottom-bar">
      <div class="field">
        <div class="field-label">AG</div>
        <input class="field-input" id="agInput" type="text" inputmode="decimal" value="3" />
      </div>
      <div class="field">
        <div class="field-label">AB</div>
        <input class="field-input" id="abInput" type="text" inputmode="decimal" value="5" />
      </div>
      <div class="field">
        <div class="field-label">BF</div>
        <input class="field-input" id="bfInput" type="text" inputmode="decimal" value="4" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=segment-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    (function () {
      'use strict';

      function trianglePointFromSides(aToB, bToC, aToC, sign) {
        const x = (aToB * aToB + aToC * aToC - bToC * bToC) / (2 * aToC);
        const hSquared = Math.max(0, aToB * aToB - x * x);
        return { x: x, y: sign * Math.sqrt(hSquared) };
      }

      function buildQuadrilateralFromSides(sides) {
        const lengths = [sides.AB, sides.BC, sides.CD, sides.DA];
        const max = Math.max.apply(null, lengths);
        const sum = lengths.reduce(function (total, value) { return total + value; }, 0);
        if (!(max < sum - max)) {
          throw new Error('この長さでは凸四角形を作れません。いちばん長い辺を、他の3辺の合計より短くしてください。');
        }

        const firstMin = Math.abs(sides.AB - sides.BC) + 0.001;
        const firstMax = sides.AB + sides.BC - 0.001;
        const secondMin = Math.abs(sides.CD - sides.DA) + 0.001;
        const secondMax = sides.CD + sides.DA - 0.001;
        const minDiagonal = Math.max(firstMin, secondMin);
        const maxDiagonal = Math.min(firstMax, secondMax);
        if (!(minDiagonal < maxDiagonal)) {
          throw new Error('この長さでは凸四角形を作れません。入力値を調整してください。');
        }

        const diagonal = (minDiagonal + maxDiagonal) / 2;
        return {
          A: { x: 0, y: 0 },
          B: trianglePointFromSides(sides.AB, sides.BC, diagonal, 1),
          C: { x: diagonal, y: 0 },
          D: trianglePointFromSides(sides.DA, sides.CD, diagonal, -1)
        };
      }

      function midpoint(P, Q) {
        return { x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2 };
      }

      function distance(P, Q) {
        return Math.hypot(Q.x - P.x, Q.y - P.y);
      }

      function orientAbTopCounterclockwise(points) {
        const dx = points.B.x - points.A.x;
        const dy = points.B.y - points.A.y;
        const angle = Math.atan2(dy, dx);
        const targetAngle = Math.PI;
        const cos = Math.cos(targetAngle - angle);
        const sin = Math.sin(targetAngle - angle);
        const oriented = {};
        ['A', 'B', 'C', 'D'].forEach(function (id) {
          const x = points[id].x - points.A.x;
          const y = points[id].y - points.A.y;
          oriented[id] = {
            x: x * cos - y * sin,
            y: x * sin + y * cos
          };
        });
        if ((oriented.C.y + oriented.D.y) / 2 > 0) {
          ['A', 'B', 'C', 'D'].forEach(function (id) {
            oriented[id].y *= -1;
          });
        }
        return oriented;
      }

      function pointAwayFromCenter(point, center, amount) {
        const dx = point.x - center.x;
        const dy = point.y - center.y;
        const length = Math.hypot(dx, dy) || 1;
        return { x: point.x + dx / length * amount, y: point.y + dy / length * amount };
      }

      function appendPointLabel(ctx, id, point, center) {
        const labelPoint = pointAwayFromCenter(point, center, 0.34);
        const screenPoint = ctx.fitPoint(point);
        const screenLabel = ctx.fitPoint(labelPoint);
        ctx.stage.appendChild(ctx.createSvg('circle', {
          cx: screenPoint.x,
          cy: screenPoint.y,
          r: 7,
          fill: '#1f2430'
        }));
        ctx.stage.appendChild(ctx.createLabelNode(id, {
          x: screenLabel.x,
          y: screenLabel.y,
          'text-anchor': 'middle',
          'dominant-baseline': 'middle',
          'font-size': '50',
          'font-weight': '700',
          fill: '#1f2430'
        }));
      }

      function appendHiddenSegment(ctx, id, P, Q) {
        const p = ctx.fitPoint(P);
        const q = ctx.fitPoint(Q);
        const hit = ctx.createSvg('line', {
          x1: p.x,
          y1: p.y,
          x2: q.x,
          y2: q.y,
          stroke: 'transparent',
          'stroke-width': '28',
          'stroke-linecap': 'round'
        });
        ctx.attachHit(hit, 'side', id);
        ctx.stage.appendChild(hit);
      }

      function appendVisibleSegment(ctx, P, Q) {
        const p = ctx.fitPoint(P);
        const q = ctx.fitPoint(Q);
        ctx.stage.appendChild(ctx.createSvg('line', {
          x1: p.x,
          y1: p.y,
          x2: q.x,
          y2: q.y,
          stroke: '#2a5bd7',
          'stroke-width': '3',
          'stroke-linecap': 'round'
        }));
      }

      function appendSegmentModal(ctx, id, P, Q, kind) {
        ctx.state.sides[id] = distance(P, Q);
        appendHiddenSegment(ctx, id, P, Q);
        if (kind) ctx.drawSideKind(kind, ctx.fitPoint(P), ctx.fitPoint(Q));
      }

      function drawMarkedPair(ctx, firstId, secondId, P, M, Q, kind) {
        appendSegmentModal(ctx, firstId, P, M, kind);
        appendSegmentModal(ctx, secondId, M, Q, kind);
      }

      window.InstantGeometryQuadrilateralMobile.createPage({
        readyMessage: 'AG、AB、BF から中点連結定理⑥を描画しました。',
        fileBase: 'midpoint-theorem-6',
        showArea: true,
        skipBaseAngles: true,
        hiddenBaseSides: ['BC', 'DA'],
        controlInputIds: {
          AG: 'agInput',
          AB: 'abInput',
          BF: 'bfInput'
        },
        initialState: {
          pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D' },
          sides: { AB: 0, BC: 0, CD: 0, DA: 0, BF: 0, FC: 0, DG: 0, GA: 0, GE: 0, EF: 0, FG: 0, BE: 0, ED: 0 },
          sideInputs: { AB: '', BC: '', CD: '', DA: '', BF: '', FC: '', DG: '', GA: '', GE: '', EF: '', FG: '', BE: '', ED: '' },
          sideKinds: { AB: 'single', BC: 'plain', CD: 'single', DA: 'plain', BF: 'double', FC: 'double', DG: 'circle', GA: 'circle', GE: 'plain', EF: 'plain', FG: 'plain', BE: 'cross', ED: 'cross' },
          sideArcVisible: { AB: false, BC: false, CD: false, DA: false, BF: false, FC: false, DG: false, GA: false, GE: false, EF: false, FG: false, BE: false, ED: false },
          angleInputs: { A: '', B: '', C: '', D: '' },
          angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden', D: 'hidden' },
          areaValue: ''
        },
        readControls: function (inputs, parsePositiveNumber) {
          return {
            AG: parsePositiveNumber(inputs.AG.value, 'AG'),
            AB: parsePositiveNumber(inputs.AB.value, 'AB'),
            BF: parsePositiveNumber(inputs.BF.value, 'BF')
          };
        },
        applyControlsToState: function (state, parsed) {
          state.sides = {
            AB: parsed.AB,
            BC: parsed.BF * 2,
            CD: parsed.AB,
            DA: parsed.AG * 2
          };
        },
        computeGeometry: function (state, parsed, helpers) {
          const sides = {
            AB: parsed.AB,
            BC: parsed.BF * 2,
            CD: parsed.AB,
            DA: parsed.AG * 2
          };
          return helpers.finalizeGeometry(orientAbTopCounterclockwise(buildQuadrilateralFromSides(sides)));
        },
        sideNumericMode: function () {
          return 'readonly';
        },
        angleNumericMode: function () {
          return 'readonly';
        },
        updateSideControl: function () {},
        updateAngleControl: function () {},
        drawAuxiliary: function (ctx) {
          const g = ctx.geometry;
          const G = midpoint(g.A, g.D);
          const F = midpoint(g.B, g.C);
          const E = midpoint(g.B, g.D);
          const center = {
            x: (g.A.x + g.B.x + g.C.x + g.D.x) / 4,
            y: (g.A.y + g.B.y + g.C.y + g.D.y) / 4
          };

          appendVisibleSegment(ctx, g.B, g.D);
          appendVisibleSegment(ctx, G, E);
          appendVisibleSegment(ctx, E, F);
          appendVisibleSegment(ctx, F, G);

          drawMarkedPair(ctx, 'GA', 'DG', g.A, G, g.D, 'circle');
          drawMarkedPair(ctx, 'BF', 'FC', g.B, F, g.C, 'double');
          drawMarkedPair(ctx, 'BE', 'ED', g.B, E, g.D, 'cross');
          appendSegmentModal(ctx, 'GE', G, E, 'plain');
          appendSegmentModal(ctx, 'EF', E, F, 'plain');
          appendSegmentModal(ctx, 'FG', F, G, 'plain');

          appendPointLabel(ctx, 'E', E, center);
          appendPointLabel(ctx, 'F', F, center);
          appendPointLabel(ctx, 'G', G, center);
        }
      });
    })();
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
