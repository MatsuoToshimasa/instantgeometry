<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>平行四辺形（2辺＋角） | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">平行四辺形（2辺＋角）</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status error" id="statusBox">2辺と角Aを入力すると、平行四辺形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="平行四辺形（2辺＋角）の描画画面"></svg>
    </section>

    <footer class="bottom-bar">
      <div class="field">
        <div class="field-label">AB</div>
        <input class="field-input" id="sideABInput" type="text" inputmode="decimal" value="7" />
      </div>
      <div class="field">
        <div class="field-label">AD</div>
        <input class="field-input" id="sideADInput" type="text" inputmode="decimal" value="5" />
      </div>
      <div class="field">
        <div class="field-label">角A</div>
        <input class="field-input" id="angleAInput" type="text" inputmode="decimal" value="60" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    window.InstantGeometryQuadrilateralMobile.createPage({
      readyMessage: '入力をもとに平行四辺形を描画しています。',
      fileBase: 'quadrilateral-parallelogram-angle',
      controlInputIds: {
        sideAB: 'sideABInput',
        sideAD: 'sideADInput',
        angleA: 'angleAInput'
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D' },
        sides: { AB: 7, BC: 5, CD: 7, DA: 5 },
        sideInputs: { AB: ' ', BC: '', CD: '', DA: ' ' },
        sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain' },
        sideArcVisible: { AB: true, BC: false, CD: false, DA: true },
        angleInputs: { A: ' ', B: '', C: '', D: '' },
        angleKinds: { A: 'plain', B: 'hidden', C: 'hidden', D: 'hidden' },
        areaValue: ''
      },
      readControls: function (inputs, parsePositiveNumber) {
        const angleA = parsePositiveNumber(inputs.angleA.value, '角A');
        if (!(angleA > 0 && angleA < 180)) {
          throw new Error('角A は 0° より大きく 180° 未満で入力してください。');
        }
        return {
          sideAB: parsePositiveNumber(inputs.sideAB.value, 'AB'),
          sideAD: parsePositiveNumber(inputs.sideAD.value, 'AD'),
          angleA: angleA
        };
      },
      applyControlsToState: function (state, parsed) {
        state.sides.AB = parsed.sideAB;
        state.sides.BC = parsed.sideAD;
        state.sides.CD = parsed.sideAB;
        state.sides.DA = parsed.sideAD;
      },
      computeGeometry: function (state, parsed, helpers) {
        const theta = parsed.angleA * Math.PI / 180;
        const ax = -(parsed.sideAD / 2) - (parsed.sideAB * Math.cos(theta) / 2);
        const ay = parsed.sideAB * Math.sin(theta) / 2;
        const A = { x: ax, y: ay };
        const B = {
          x: ax + parsed.sideAB * Math.cos(theta),
          y: ay - parsed.sideAB * Math.sin(theta)
        };
        const D = { x: ax + parsed.sideAD, y: ay };
        const C = { x: D.x + (B.x - A.x), y: D.y + (B.y - A.y) };
        return helpers.finalizeGeometry({ A: A, B: B, C: C, D: D });
      },
      sideNumericMode: function () {
        return 'control';
      },
      angleNumericMode: function () {
        return 'control';
      },
      updateSideControl: function (id, value, state, inputs) {
        if (id === 'AB' || id === 'CD') {
          inputs.sideAB.value = String(value);
          state.sides.AB = value;
          state.sides.CD = value;
        } else {
          inputs.sideAD.value = String(value);
          state.sides.BC = value;
          state.sides.DA = value;
        }
      },
      updateAngleControl: function (id, value, state, inputs) {
        const nextAngleA = id === 'A' || id === 'C' ? value : 180 - value;
        inputs.angleA.value = String(nextAngleA);
      }
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
