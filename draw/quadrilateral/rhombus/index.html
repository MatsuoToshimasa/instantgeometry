<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>菱形 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">菱形</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status error" id="statusBox">横対角線と縦対角線を入力すると、菱形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="菱形の描画画面"></svg>
    </section>

    <footer class="bottom-bar two-fields">
      <div class="field">
        <div class="field-label">横対角線</div>
        <input class="field-input" id="horizontalDiagInput" type="text" inputmode="decimal" value="8" />
      </div>
      <div class="field">
        <div class="field-label">縦対角線</div>
        <input class="field-input" id="verticalDiagInput" type="text" inputmode="decimal" value="5" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    window.InstantGeometryQuadrilateralMobile.createPage({
      readyMessage: '入力をもとに菱形を描画しています。',
      fileBase: 'quadrilateral-rhombus',
      showArea: false,
      useRootSideLabels: true,
      controlInputIds: {
        horizontal: 'horizontalDiagInput',
        vertical: 'verticalDiagInput'
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D' },
        sides: { AB: 0, BC: 0, CD: 0, DA: 0, AC: 0, BD: 0 },
        sideInputs: { AB: '', BC: '', CD: '', DA: '', AC: ' ', BD: ' ' },
        sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain', AC: 'plain', BD: 'plain' },
        sideArcVisible: { AB: false, BC: false, CD: false, DA: false, AC: true, BD: true },
        angleInputs: { A: '', B: '', C: '', D: '' },
        angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden', D: 'hidden' }
      },
      readControls: function (inputs, parsePositiveNumber) {
        return {
          horizontal: parsePositiveNumber(inputs.horizontal.value, '横対角線'),
          vertical: parsePositiveNumber(inputs.vertical.value, '縦対角線')
        };
      },
      applyControlsToState: function () {},
      computeGeometry: function (state, parsed, helpers) {
        const geometry = helpers.finalizeGeometry({
          A: { x: 0, y: parsed.vertical / 2 },
          B: { x: -parsed.horizontal / 2, y: 0 },
          C: { x: 0, y: -parsed.vertical / 2 },
          D: { x: parsed.horizontal / 2, y: 0 }
        });
        state.sides.AC = parsed.vertical;
        state.sides.BD = parsed.horizontal;
        return geometry;
      },
      drawAuxiliary: function (helpers) {
        const state = helpers.state;
        const geometry = helpers.geometry;
        state.sides.AC = Math.hypot(geometry.A.x - geometry.C.x, geometry.A.y - geometry.C.y);
        state.sides.BD = Math.hypot(geometry.B.x - geometry.D.x, geometry.B.y - geometry.D.y);
        state.sideDisplay = state.sideDisplay || {};
        state.sideDisplay.AC = helpers.formatLengthBetween(geometry.A, geometry.C);
        state.sideDisplay.BD = helpers.formatLengthBetween(geometry.B, geometry.D);

        function drawDiagonal(id, p, q, offset) {
          const start = helpers.screen[p];
          const end = helpers.screen[q];
          const line = helpers.createSvg('line', {
            x1: start.x,
            y1: start.y,
            x2: end.x,
            y2: end.y,
            stroke: '#687086',
            'stroke-width': '3',
            'stroke-dasharray': '8 7',
            'stroke-linecap': 'round'
          });
          helpers.attachHit(line, 'side', id);
          helpers.stage.appendChild(line);

          const label = helpers.getSideLabelValue(id);
          if (!label) return;
          const labelPoint = {
            x: (start.x + end.x) / 2 + offset.x,
            y: (start.y + end.y) / 2 + offset.y
          };
          if (state.sideArcVisible[id] !== false) {
            const geom = helpers.sideArcGeometry(start, end, helpers.screen.center, labelPoint);
            helpers.stage.appendChild(helpers.createSvg('path', {
              d: helpers.quadraticPathSegment(start, geom.control, end, 0, 0.5 - geom.gapHalf, 20),
              fill: 'none',
              stroke: '#2a5bd7',
              'stroke-width': '2',
              'stroke-linecap': 'round',
              'stroke-dasharray': '6 5'
            }));
            helpers.stage.appendChild(helpers.createSvg('path', {
              d: helpers.quadraticPathSegment(start, geom.control, end, 0.5 + geom.gapHalf, 1, 20),
              fill: 'none',
              stroke: '#2a5bd7',
              'stroke-width': '2',
              'stroke-linecap': 'round',
              'stroke-dasharray': '6 5'
            }));
          }
          const labelAttrs = {
            x: labelPoint.x,
            y: labelPoint.y,
            'text-anchor': 'middle',
            'dominant-baseline': 'middle',
            'font-size': '56',
            'font-weight': '700',
            fill: '#2a5bd7'
          };
          const textNode = helpers.createLabelNode ? helpers.createLabelNode(label, labelAttrs) : helpers.createSvg('text', labelAttrs);
          if (!helpers.createLabelNode) textNode.textContent = label;
          helpers.attachHit(textNode, 'side', id);
          helpers.stage.appendChild(textNode);
        }

        drawDiagonal('AC', 'A', 'C', { x: 84, y: 60 });
        drawDiagonal('BD', 'B', 'D', { x: -84, y: -60 });
      },
      sideNumericMode: function () {
        return 'readonly';
      },
      angleNumericMode: function () {
        return 'readonly';
      },
      updateSideControl: function () {},
      updateAngleControl: function () {}
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
