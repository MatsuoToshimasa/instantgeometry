<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>正方形（対角線） | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">正方形（対角線）</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status error" id="statusBox">1辺を入力すると、対角線の交点Oをもつ正方形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="正方形（対角線）の描画画面"></svg>
    </section>

    <footer class="bottom-bar one-field">
      <div class="field">
        <div class="field-label">1辺</div>
        <input class="field-input" id="sideInput" type="text" inputmode="decimal" value="5" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    window.InstantGeometryQuadrilateralMobile.createPage({
      readyMessage: '入力をもとに正方形（対角線）を描画しています。',
      fileBase: 'quadrilateral-square-diagonal',
      showArea: false,
      controlInputIds: {
        side: 'sideInput'
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D', O: 'O' },
        sides: { AB: 5, BC: 5, CD: 5, DA: 5, OA: 0, OB: 0, OC: 0, OD: 0 },
        sideInputs: { AB: ' ', BC: '', CD: '', DA: ' ', OA: '', OB: '', OC: '', OD: '' },
        sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain', OA: 'circle', OB: 'circle', OC: 'circle', OD: 'circle' },
        sideArcVisible: { AB: true, BC: true, CD: true, DA: true, OA: false, OB: false, OC: false, OD: false },
        angleInputs: { A: '', B: '', C: '', D: '' },
        angleKinds: { A: 'right', B: 'right', C: 'right', D: 'right' }
      },
      readControls: function (inputs, parsePositiveNumber) {
        return {
          side: parsePositiveNumber(inputs.side.value, '1辺')
        };
      },
      applyControlsToState: function (state, parsed) {
        state.sides.AB = parsed.side;
        state.sides.BC = parsed.side;
        state.sides.CD = parsed.side;
        state.sides.DA = parsed.side;
      },
      computeGeometry: function (state, parsed, helpers) {
        const side = parsed.side;
        const half = side / 2;
        const geometry = helpers.finalizeGeometry({
          A: { x: -half, y: half },
          B: { x: -half, y: -half },
          C: { x: half, y: -half },
          D: { x: half, y: half }
        });
        geometry.O = { x: 0, y: 0 };
        return geometry;
      },
      drawAuxiliary: function (helpers) {
        const state = helpers.state;
        const geometry = helpers.geometry;
        const O = geometry.O || geometry.center;
        const tO = helpers.fitPoint(O);
        const createSvg = helpers.createSvg;

        function distance(P, Q) {
          return Math.hypot(P.x - Q.x, P.y - Q.y);
        }

        ['A', 'B', 'C', 'D'].forEach(function (pointId) {
          const id = 'O' + pointId;
          state.sides[id] = distance(O, geometry[pointId]);
          state.sideDisplay = state.sideDisplay || {};
          state.sideDisplay[id] = helpers.formatLengthBetween(O, geometry[pointId]);
          const endpoint = helpers.screen[pointId];
          const line = createSvg('line', {
            x1: tO.x,
            y1: tO.y,
            x2: endpoint.x,
            y2: endpoint.y,
            stroke: '#687086',
            'stroke-width': '3',
            'stroke-dasharray': '8 7',
            'stroke-linecap': 'round'
          });
          helpers.attachHit(line, 'side', id);
          helpers.stage.appendChild(line);
          const hit = createSvg('line', {
            x1: tO.x,
            y1: tO.y,
            x2: endpoint.x,
            y2: endpoint.y,
            stroke: 'transparent',
            'stroke-width': '28',
            'stroke-linecap': 'round'
          });
          helpers.attachHit(hit, 'side', id);
          helpers.stage.appendChild(hit);
          helpers.drawSideKind(state.sideKinds[id], tO, endpoint);
        });

        const dot = createSvg('circle', { cx: tO.x, cy: tO.y, r: 8, fill: '#1f2430' });
        helpers.attachHit(dot, 'point', 'O');
        helpers.stage.appendChild(dot);
        const oLabel = String(state.pointInputs.O || '').trim();
        if (oLabel) {
          const textNode = createSvg('text', {
            x: tO.x + 34,
            y: tO.y - 34,
            'text-anchor': 'middle',
            'dominant-baseline': 'middle',
            'font-size': '56',
            'font-weight': '700',
            fill: '#1f2430'
          });
          textNode.textContent = oLabel;
          helpers.attachHit(textNode, 'point', 'O');
          helpers.stage.appendChild(textNode);
        }
      },
      sideNumericMode: function () {
        return 'control';
      },
      angleNumericMode: function () {
        return 'readonly';
      },
      updateSideControl: function (id, value, state, inputs) {
        inputs.side.value = String(value);
        state.sides.AB = value;
        state.sides.BC = value;
        state.sides.CD = value;
        state.sides.DA = value;
      },
      updateAngleControl: function () {}
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
