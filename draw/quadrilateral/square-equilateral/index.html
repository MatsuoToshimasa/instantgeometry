<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>正方形と正三角形 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">正方形と正三角形</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status error" id="statusBox">BC を入力すると、正方形 ABCD と正三角形 BCE を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="正方形と正三角形の描画画面"></svg>
    </section>

    <footer class="bottom-bar one-field">
      <div class="field">
        <div class="field-label">BC</div>
        <input class="field-input" id="bcInput" type="text" inputmode="decimal" value="6" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    (function () {
      'use strict';

      const EXTRA_SEGMENTS = ['EB', 'EC', 'ED'];
      const EXTRA_ANGLES = ['ABE', 'ADE', 'EBC', 'BCE', 'CEB', 'CED', 'CDE', 'ECD'];

      function distance(P, Q) {
        return Math.hypot(Q.x - P.x, Q.y - P.y);
      }

      function angleDegrees(p1, vertex, p2) {
        const ux = p1.x - vertex.x;
        const uy = p1.y - vertex.y;
        const vx = p2.x - vertex.x;
        const vy = p2.y - vertex.y;
        const denom = (Math.hypot(ux, uy) || 1) * (Math.hypot(vx, vy) || 1);
        const cosine = Math.max(-1, Math.min(1, (ux * vx + uy * vy) / denom));
        return Math.acos(cosine) * 180 / Math.PI;
      }

      function segmentLabelPoint(P, Q, center, distanceValue) {
        const mid = { x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2 };
        const dx = Q.x - P.x;
        const dy = Q.y - P.y;
        const len = Math.hypot(dx, dy) || 1;
        let nx = -dy / len;
        let ny = dx / len;
        if (nx * (center.x - mid.x) + ny * (center.y - mid.y) > 0) {
          nx *= -1;
          ny *= -1;
        }
        return { x: mid.x + nx * distanceValue, y: mid.y + ny * distanceValue };
      }

      function pointLabelPoint(point, center) {
        return {
          x: point.x + (point.x - center.x) * 0.14,
          y: point.y + (point.y - center.y) * 0.14
        };
      }

      window.InstantGeometryQuadrilateralMobile.createPage({
        readyMessage: '入力をもとに正方形と正三角形を描画しています。',
        fileBase: 'quadrilateral-square-equilateral',
        skipBaseAngles: true,
        showArea: false,
        controlInputIds: {
          side: 'bcInput'
        },
        initialState: {
          pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D', E: 'E' },
          sides: { AB: 6, BC: 6, CD: 6, DA: 6, EB: 6, EC: 6, ED: 6 },
          sideInputs: { AB: '', BC: ' ', CD: '', DA: '', EB: '', EC: '', ED: '' },
          sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain', EB: 'plain', EC: 'plain', ED: 'plain' },
          sideArcVisible: { AB: true, BC: true, CD: true, DA: true, EB: true, EC: true, ED: true },
          angleInputs: { A: '', B: '', C: '', D: '' },
          angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden', D: 'hidden' },
          extraAngleInputs: { ABE: '', ADE: '', EBC: '', BCE: '', CEB: '', CED: '', CDE: '', ECD: '' },
          extraAngleKinds: { ABE: 'hidden', ADE: 'hidden', EBC: 'hidden', BCE: 'hidden', CEB: 'hidden', CED: 'hidden', CDE: 'hidden', ECD: 'hidden' },
          extraAreaInputs: { ABED: '', BCE: '', CDE: '' },
          extraAreaColors: { ABED: '#2a5bd7', BCE: '#2a5bd7', CDE: '#2a5bd7' },
          areaValue: ''
        },
        readControls: function (inputs, parsePositiveNumber) {
          return {
            side: parsePositiveNumber(inputs.side.value, 'BC')
          };
        },
        applyControlsToState: function (state, parsed) {
          ['AB', 'BC', 'CD', 'DA', 'EB', 'EC'].forEach(function (id) {
            state.sides[id] = parsed.side;
          });
        },
        computeGeometry: function (state, parsed, helpers) {
          const side = parsed.side;
          const h = side * Math.sqrt(3) / 2;
          const points = {
            A: { x: -side / 2, y: side / 2 },
            B: { x: -side / 2, y: -side / 2 },
            C: { x: side / 2, y: -side / 2 },
            D: { x: side / 2, y: side / 2 },
            E: { x: 0, y: -side / 2 + h }
          };
          const geometry = helpers.finalizeGeometry(points);
          geometry.E = points.E;
          geometry.sides.EB = distance(points.E, points.B);
          geometry.sides.EC = distance(points.E, points.C);
          geometry.sides.ED = distance(points.E, points.D);
          state.sides.ED = geometry.sides.ED;
          return geometry;
        },
        sideNumericMode: function () {
          return 'control';
        },
        angleNumericMode: function () {
          return 'readonly';
        },
        updateSideControl: function (id, value, state, inputs) {
          if (id === 'BC') inputs.side.value = String(value);
          ['AB', 'BC', 'CD', 'DA', 'EB', 'EC'].forEach(function (sideId) {
            state.sides[sideId] = value;
          });
        },
        updateAngleControl: function () {},
        extraAngles: function (context) {
          const g = context.geometry;
          const definitions = {
            ABE: ['A', 'B', 'E'],
            ADE: ['A', 'D', 'E'],
            EBC: ['E', 'B', 'C'],
            BCE: ['B', 'C', 'E'],
            CEB: ['C', 'E', 'B'],
            CED: ['C', 'E', 'D'],
            CDE: ['C', 'D', 'E'],
            ECD: ['E', 'C', 'D']
          };
          return EXTRA_ANGLES.map(function (id) {
            const names = definitions[id];
            return {
              id: id,
              name: '∠' + id,
              p1: g[names[0]],
              vertex: g[names[1]],
              p2: g[names[2]],
              value: angleDegrees(g[names[0]], g[names[1]], g[names[2]]),
              arcRadius: context.state.sides.BC * (id === 'ADE' || id === 'CDE' || id === 'ECD' ? 0.18 : 0.24),
              hitRadius: context.state.sides.BC * 0.42
            };
          });
        },
        extraAreas: function (context) {
          const g = context.geometry;
          return [
            {
              id: 'ABED',
              name: '□ABED',
              points: [g.A, g.B, g.E, g.D],
              color: '#2a5bd7'
            },
            {
              id: 'BCE',
              name: '△BCE',
              points: [g.B, g.C, g.E],
              color: '#2a5bd7'
            },
            {
              id: 'CDE',
              name: '△CDE',
              points: [g.C, g.D, g.E],
              color: '#2a5bd7'
            }
          ];
        },
        drawAuxiliary: function (ctx) {
          const g = ctx.geometry;
          const center = {
            x: (g.A.x + g.B.x + g.C.x + g.D.x + g.E.x) / 5,
            y: (g.A.y + g.B.y + g.C.y + g.D.y + g.E.y) / 5
          };
          const points = { E: ctx.fitPoint(g.E) };
          const screenCenter = ctx.fitPoint(center);

          EXTRA_SEGMENTS.forEach(function (id) {
            const P = g[id[0]];
            const Q = g[id[1]];
            const p = ctx.fitPoint(P);
            const q = ctx.fitPoint(Q);
            const visible = ctx.createSvg('line', {
              x1: p.x,
              y1: p.y,
              x2: q.x,
              y2: q.y,
              stroke: '#2a5bd7',
              'stroke-width': '3',
              'stroke-linecap': 'round',
              'stroke-dasharray': ''
            });
            ctx.attachHit(visible, 'side', id);
            ctx.stage.appendChild(visible);
            ctx.drawSideKind(ctx.state.sideKinds[id], p, q);

            const hit = ctx.createSvg('line', {
              x1: p.x,
              y1: p.y,
              x2: q.x,
              y2: q.y,
              stroke: 'transparent',
              'stroke-width': '28',
              'stroke-linecap': 'round'
            });
            ctx.attachHit(hit, 'side', id);
            ctx.stage.appendChild(hit);

            const label = ctx.getSideLabelValue(id);
            if (label) {
              const pos = ctx.fitPoint(segmentLabelPoint(P, Q, center, Math.max(0.35, ctx.state.sides.BC * 0.07)));
              if (ctx.state.sideArcVisible[id] !== false) {
                const geom = ctx.sideArcGeometry(p, q, screenCenter, pos);
                ctx.stage.appendChild(ctx.createSvg('path', {
                  d: ctx.quadraticPathSegment(p, geom.control, q, 0, 0.5 - geom.gapHalf, 20),
                  fill: 'none',
                  stroke: '#2a5bd7',
                  'stroke-width': '2',
                  'stroke-linecap': 'round',
                  'stroke-dasharray': '6 5'
                }));
                ctx.stage.appendChild(ctx.createSvg('path', {
                  d: ctx.quadraticPathSegment(p, geom.control, q, 0.5 + geom.gapHalf, 1, 20),
                  fill: 'none',
                  stroke: '#2a5bd7',
                  'stroke-width': '2',
                  'stroke-linecap': 'round',
                  'stroke-dasharray': '6 5'
                }));
              }
              const text = ctx.createLabelNode(label, {
                x: pos.x,
                y: pos.y,
                'text-anchor': 'middle',
                'dominant-baseline': 'middle',
                'font-size': '48',
                'font-weight': '700',
                fill: '#2a5bd7'
              });
              ctx.attachHit(text, 'side', id);
              ctx.stage.appendChild(text);
            }
          });

          const ePoint = ctx.createSvg('circle', { cx: points.E.x, cy: points.E.y, r: 8, fill: '#1f2430' });
          ctx.attachHit(ePoint, 'point', 'E');
          ctx.stage.appendChild(ePoint);

          const eLabel = ctx.getPointLabelValue('E');
          if (eLabel) {
            const pos = ctx.fitPoint(pointLabelPoint(g.E, center));
            const text = ctx.createLabelNode(eLabel, {
              x: pos.x,
              y: pos.y,
              'text-anchor': 'middle',
              'dominant-baseline': 'middle',
              'font-size': '60',
              'font-weight': '700',
              fill: '#1f2430'
            });
            ctx.attachHit(text, 'point', 'E');
            ctx.stage.appendChild(text);
          }
        }
      });
    })();
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
