<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>中点連結定理③ | Instant Geometry</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">中点連結定理③</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">AB、CD、AF、FD、ADx から、AB//CD//EF となる中点連結定理③を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="中点連結定理③の描画画面"></svg>
    </section>

    <footer class="bottom-bar five-fields">
      <div class="field">
        <div class="field-label">AB</div>
        <input class="field-input" id="abInput" type="text" inputmode="decimal" value="6" />
      </div>
      <div class="field">
        <div class="field-label">CD</div>
        <input class="field-input" id="cdInput" type="text" inputmode="decimal" value="8" />
      </div>
      <div class="field">
        <div class="field-label">AF</div>
        <input class="field-input" id="afInput" type="text" inputmode="decimal" value="5" />
      </div>
      <div class="field">
        <div class="field-label">FD</div>
        <input class="field-input" id="fdInput" type="text" inputmode="decimal" value="5" />
      </div>
      <div class="field">
        <div class="field-label">ADx</div>
        <input class="field-input" id="adxInput" type="text" inputmode="decimal" value="-1" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/mobile-angle-ornaments.js?v=segment-modal-1"></script>
  <script src="../../../assets/draw-shared-labels.js?v=inline-controller-1"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=inline-controller-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=inline-controller-1"></script>
  <script src="../../../assets/draw-inline-point-segment-controller.js?v=inline-controller-1"></script>
  <script>
    (function () {
      'use strict';

      const stage = document.getElementById('stage');
      const statusBox = document.getElementById('statusBox');
      const backBtn = document.getElementById('backBtn');
      const saveBtn = document.getElementById('saveBtn');
      const sheetBackdrop = document.getElementById('sheetBackdrop');
      const editSheet = document.getElementById('editSheet');
      const saveSheet = document.getElementById('saveSheet');
      const sheetTitle = document.getElementById('sheetTitle');
      const sheetBody = document.getElementById('sheetBody');
      const sheetClose = document.getElementById('sheetClose');
      const saveSheetClose = document.getElementById('saveSheetClose');
      const savePngBtn = document.getElementById('savePngBtn');
      const saveTransparentBtn = document.getElementById('saveTransparentBtn');
      const savePdfBtn = document.getElementById('savePdfBtn');
      const captureRoot = document.getElementById('captureRoot');
      const inputs = {
        AB: document.getElementById('abInput'),
        CD: document.getElementById('cdInput'),
        AF: document.getElementById('afInput'),
        FD: document.getElementById('fdInput'),
        ADx: document.getElementById('adxInput')
      };

      const pointIds = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
      const segmentIds = ['AB', 'CD', 'CE', 'EB', 'AF', 'FD', 'FG', 'GE', 'BG', 'GD'];
      const state = {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D', E: 'E', F: 'F', G: 'G' },
        segmentInputs: { AB: ' ', CD: ' ', CE: ' ', EB: ' ', AF: ' ', FD: ' ', FG: ' ', GE: ' ', BG: ' ', GD: ' ' },
        segmentKinds: { AB: 'plain', CD: 'plain', CE: 'plain', EB: 'plain', AF: 'plain', FD: 'plain', FG: 'plain', GE: 'plain', BG: 'plain', GD: 'plain' },
        segmentArcVisible: { AB: true, CD: true, CE: true, EB: true, AF: true, FD: true, FG: true, GE: true, BG: true, GD: true }
      };

      let geometry = null;
      let labelAdapter = null;

      if (window.InstantGeometrySaveQuota) {
        window.InstantGeometrySaveQuota.createIndicator({ target: saveBtn });
      }

      function svg(tag, attrs) {
        const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.keys(attrs || {}).forEach(function (key) {
          if (attrs[key] !== null && attrs[key] !== undefined) node.setAttribute(key, String(attrs[key]));
        });
        return node;
      }

      function setStatus(message, isError) {
        statusBox.textContent = message;
        statusBox.classList.toggle('error', Boolean(isError));
      }

      function initLabelAdapter() {
        if (!window.InstantGeometryInlinePointSegmentController) return;
        labelAdapter = window.InstantGeometryInlinePointSegmentController.create({
          state: state,
          createSvg: svg,
          editSheet: editSheet,
          sheetTitle: sheetTitle,
          sheetBody: sheetBody,
          sheetBackdrop: sheetBackdrop,
          closeSheets: closeSheets,
          render: render,
          setStatus: setStatus,
          getTitle: function (kind, id) {
            return kind === 'point' ? '点 ' + (state.pointInputs[id] || id) : '線分 ' + id;
          }
        });
      }

      function parsePositive(value, name) {
        const text = String(value || '').trim();
        if (!/^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.[0-9]*[1-9][0-9]*)$/.test(text)) {
          throw new Error(name + ' には正の数を入力してください。');
        }
        return Number(text);
      }

      function parseFinite(value, name) {
        const text = String(value || '').trim();
        if (!/^-?(?:[0-9]+(?:\.[0-9]+)?|\.[0-9]+)$/.test(text)) {
          throw new Error(name + ' には数を入力してください。');
        }
        const number = Number(text);
        if (!Number.isFinite(number)) {
          throw new Error(name + ' には数を入力してください。');
        }
        return number;
      }

      function formatNumber(value) {
        const rounded = Math.round(value * 100) / 100;
        return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
      }

      function length(P, Q) {
        return Math.hypot(P.x - Q.x, P.y - Q.y);
      }

      function buildGeometry(values) {
        const AB = values.AB;
        const CD = values.CD;
        const AF = values.AF;
        const FD = values.FD;
        const ADx = values.ADx;
        const AD = AF + FD;
        if (!(AD > Math.abs(ADx))) {
          throw new Error('ADx の絶対値は AF + FD より小さくしてください。');
        }
        const h = Math.sqrt(Math.max(0, AD * AD - ADx * ADx));
        const A = { x: AB, y: 0 };
        const B = { x: 0, y: 0 };
        const D = { x: A.x + ADx, y: -h };
        const C = { x: D.x - CD, y: -h };
        const u = AF / AD;
        const F = { x: A.x + (D.x - A.x) * u, y: A.y + (D.y - A.y) * u };
        const E = { x: B.x + (C.x - B.x) * u, y: F.y };
        const bdT = (F.y - B.y) / (D.y - B.y);
        const G = { x: B.x + (D.x - B.x) * bdT, y: F.y };
        return {
          A: A,
          B: B,
          C: C,
          D: D,
          E: E,
          F: F,
          G: G,
          values: {
            AB: AB,
            CD: CD,
            CE: length(C, E),
            EB: length(E, B),
            AF: AF,
            FD: FD,
            FG: length(F, G),
            GE: length(G, E),
            BG: length(B, G),
            GD: length(G, D)
          },
          center: {
            x: (A.x + B.x + C.x + D.x) / 4,
            y: (A.y + B.y + C.y + D.y) / 4
          }
        };
      }

      function computeView(g) {
        const points = pointIds.map(function (id) { return g[id]; });
        const xs = points.map(function (p) { return p.x; });
        const ys = points.map(function (p) { return p.y; });
        const minX = Math.min.apply(null, xs);
        const maxX = Math.max.apply(null, xs);
        const minY = Math.min.apply(null, ys);
        const maxY = Math.max.apply(null, ys);
        const width = Math.max(1, maxX - minX);
        const height = Math.max(1, maxY - minY);
        const pad = Math.max(width, height) * 0.18;
        const size = Math.max(width, height) + pad * 2;
        return { x: minX - (size - width) / 2, y: minY - (size - height) / 2, size: size };
      }

      function fit(point, view) {
        return {
          x: ((point.x - view.x) / view.size) * 1000,
          y: 1000 - ((point.y - view.y) / view.size) * 1000
        };
      }

      function midpoint(P, Q) {
        return { x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2 };
      }

      function labelPoint(P, Q, toward, distance, side) {
        const m = midpoint(P, Q);
        return labelPointFromBase(P, Q, m, toward, distance, side);
      }

      function labelPointFromBase(P, Q, base, toward, distance, side) {
        const dx = Q.x - P.x;
        const dy = Q.y - P.y;
        const len = Math.hypot(dx, dy) || 1;
        let nx = -dy / len;
        let ny = dx / len;
        const dot = nx * (toward.x - base.x) + ny * (toward.y - base.y);
        const shouldPointToward = side === 'toward';
        if ((shouldPointToward && dot < 0) || (!shouldPointToward && dot > 0)) {
          nx *= -1;
          ny *= -1;
        }
        return { x: base.x + nx * distance, y: base.y + ny * distance };
      }

      function pointAt(P, Q, t) {
        return { x: P.x + (Q.x - P.x) * t, y: P.y + (Q.y - P.y) * t };
      }

      function attach(node, kind, id) {
        node.dataset.kind = kind;
        node.dataset.id = id;
        node.style.cursor = 'pointer';
        node.addEventListener('click', function (event) {
          event.stopPropagation();
          openSheet(kind, id);
        });
      }

      function createText(text, attrs) {
        const node = svg('text', attrs);
        node.textContent = text;
        return node;
      }

      function drawSideKind(kind, P, Q, color) {
        if (!kind || kind === 'plain') return;
        if (window.InstantGeometryMobileAngleOrnaments && window.InstantGeometryMobileAngleOrnaments.drawSegmentKind(stage, kind, P, Q, svg, { color: color || '#2a5bd7' })) return;
        const mid = midpoint(P, Q);
        const dx = Q.x - P.x;
        const dy = Q.y - P.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        const tx = dx / len;
        const ty = dy / len;
        const stroke = color || '#2a5bd7';
        function tick(cx, cy, half) {
          stage.appendChild(svg('line', { x1: cx - nx * half, y1: cy - ny * half, x2: cx + nx * half, y2: cy + ny * half, stroke: stroke, 'stroke-width': 3, 'stroke-linecap': 'round' }));
        }
        if (kind === 'circle') stage.appendChild(svg('circle', { cx: mid.x, cy: mid.y, r: 8, fill: 'none', stroke: stroke, 'stroke-width': 3 }));
        if (kind === 'single') tick(mid.x, mid.y, 12);
        if (kind === 'double') { tick(mid.x - tx * 9, mid.y - ty * 9, 12); tick(mid.x + tx * 9, mid.y + ty * 9, 12); }
        if (kind === 'cross') { tick(mid.x, mid.y, 12); stage.appendChild(svg('line', { x1: mid.x - tx * 9, y1: mid.y - ty * 9, x2: mid.x + tx * 9, y2: mid.y + ty * 9, stroke: stroke, 'stroke-width': 3, 'stroke-linecap': 'round' })); }
        if (kind === 'triangle') {
          stage.appendChild(svg('polygon', { points: [[mid.x + tx * 12, mid.y + ty * 12], [mid.x - tx * 8 + nx * 7, mid.y - ty * 8 + ny * 7], [mid.x - tx * 8 - nx * 7, mid.y - ty * 8 - ny * 7]].map(function (p) { return p[0] + ',' + p[1]; }).join(' '), fill: stroke, stroke: stroke, 'stroke-width': 1.5 }));
        }
      }

      function quad(P, C, Q, t) {
        return { x: (1 - t) * (1 - t) * P.x + 2 * (1 - t) * t * C.x + t * t * Q.x, y: (1 - t) * (1 - t) * P.y + 2 * (1 - t) * t * C.y + t * t * Q.y };
      }

      function drawArc(P, Q, label) {
        const mid = midpoint(P, Q);
        const control = { x: label.x * 2 - mid.x, y: label.y * 2 - mid.y };
        const parts = [];
        for (let i = 0; i <= 10; i += 1) {
          const t = i / 10 * 0.35;
          const p = quad(P, control, Q, t);
          parts.push((i ? 'L ' : 'M ') + p.x + ' ' + p.y);
        }
        for (let j = 0; j <= 10; j += 1) {
          const t = 0.65 + j / 10 * 0.35;
          const p = quad(P, control, Q, t);
          parts.push((j ? 'L ' : 'M ') + p.x + ' ' + p.y);
        }
        stage.appendChild(svg('path', { d: parts.join(' '), fill: 'none', stroke: '#2a5bd7', 'stroke-width': 2, 'stroke-dasharray': '6 5', 'stroke-linecap': 'round' }));
      }

      function segmentDefs(g) {
        return {
          AB: { p1: g.A, p2: g.B, value: g.values.AB },
          CD: { p1: g.C, p2: g.D, value: g.values.CD },
          CE: { p1: g.C, p2: g.E, value: g.values.CE },
          EB: { p1: g.E, p2: g.B, value: g.values.EB },
          AF: { p1: g.A, p2: g.F, value: g.values.AF },
          FD: { p1: g.F, p2: g.D, value: g.values.FD },
          FG: { p1: g.F, p2: g.G, value: g.values.FG },
          GE: { p1: g.G, p2: g.E, value: g.values.GE },
          BG: { p1: g.B, p2: g.G, value: g.values.BG },
          GD: { p1: g.G, p2: g.D, value: g.values.GD }
        };
      }

      function getSegmentLabel(id, def) {
        const raw = String(state.segmentInputs[id] || '');
        if (window.InstantGeometryInlinePointSegmentController) {
          return window.InstantGeometryInlinePointSegmentController.getSegmentDisplayLabel(raw, def.value, formatNumber);
        }
        return !raw ? null : (raw === ' ' || raw === '0' ? formatNumber(def.value) : raw);
      }

      function render() {
        try {
          const parsed = {
            AB: parsePositive(inputs.AB.value, 'AB'),
            CD: parsePositive(inputs.CD.value, 'CD'),
            AF: parsePositive(inputs.AF.value, 'AF'),
            FD: parsePositive(inputs.FD.value, 'FD'),
            ADx: parseFinite(inputs.ADx.value, 'ADx')
          };
          geometry = buildGeometry(parsed);
          const view = computeView(geometry);
          const s = {};
          pointIds.forEach(function (id) { s[id] = fit(geometry[id], view); });
          stage.innerHTML = '';

          stage.appendChild(svg('polygon', { points: ['A', 'B', 'C', 'D'].map(function (id) { return s[id].x + ',' + s[id].y; }).join(' '), fill: 'rgba(42,91,215,.05)', stroke: '#2a5bd7', 'stroke-width': 3 }));
          ['FG', 'GE', 'BG', 'GD'].forEach(function (id) {
            const endpoints = {
              FG: [s.F, s.G],
              GE: [s.G, s.E],
              BG: [s.B, s.G],
              GD: [s.G, s.D]
            }[id];
            stage.appendChild(svg('line', { x1: endpoints[0].x, y1: endpoints[0].y, x2: endpoints[1].x, y2: endpoints[1].y, stroke: '#2a5bd7', 'stroke-width': 3, 'stroke-linecap': 'round' }));
          });

          const defs = segmentDefs(geometry);
          segmentIds.forEach(function (id) {
            const p1 = fit(defs[id].p1, view);
            const p2 = fit(defs[id].p2, view);
            const hit = svg('line', { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, stroke: 'transparent', 'stroke-width': 28, 'stroke-linecap': 'round' });
            attach(hit, 'segment', id);
            stage.appendChild(hit);
            drawSideKind(state.segmentKinds[id], p1, p2, '#2a5bd7');
            const text = getSegmentLabel(id, defs[id]);
            if (text) {
              const side = id === 'AB' || id === 'CD' || id === 'AF' || id === 'CE' || id === 'EB' || id === 'FD' || id === 'GE' || id === 'BG' ? 'away' : 'toward';
              const baseLabelPoint = labelPoint(defs[id].p1, defs[id].p2, geometry.center, Math.max(parsed.AB, parsed.CD) * 0.075, side);
              const lp = fit(baseLabelPoint, view);
              if (state.segmentArcVisible[id] !== false) drawArc(p1, p2, lp);
              const labelAttrs = { x: lp.x, y: lp.y, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 52, 'font-weight': 700, fill: '#2a5bd7' };
              const label = (labelAdapter && labelAdapter.createSvgLabel(text, labelAttrs, 'segment', id)) || createText(text, labelAttrs);
              attach(label, 'segment', id);
              stage.appendChild(label);
            }
          });

          pointIds.forEach(function (id) {
            const dot = svg('circle', { cx: s[id].x, cy: s[id].y, r: 7, fill: '#1f2430' });
            attach(dot, 'point', id);
            stage.appendChild(dot);
          });
            const offsets = { A: { x: 34, y: -34 }, B: { x: -34, y: -34 }, C: { x: -34, y: 34 }, D: { x: 34, y: 34 }, E: { x: -34, y: -26 }, F: { x: 34, y: -26 }, G: { x: 0, y: 36 } };
          pointIds.forEach(function (id) {
            const labelText = String(state.pointInputs[id] || '').trim();
            if (!labelText) return;
            const labelAttrs = { x: s[id].x + offsets[id].x, y: s[id].y + offsets[id].y, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 54, 'font-weight': 700, fill: '#1f2430' };
            const label = (labelAdapter && labelAdapter.createSvgLabel(labelText, labelAttrs, 'point', id)) || createText(labelText, labelAttrs);
            attach(label, 'point', id);
            stage.appendChild(label);
          });
          setStatus('AB、CD、AF、FD、ADx から中点連結定理③を描画しました。', false);
        } catch (error) {
          stage.innerHTML = '';
          setStatus(error.message || '描画に失敗しました。', true);
        }
      }

      function buildSelect(labelText, value, options) {
        const field = document.createElement('div');
        field.className = 'sheet-field';
        const label = document.createElement('label');
        label.textContent = labelText;
        const select = document.createElement('select');
        options.forEach(function (option) {
          const node = document.createElement('option');
          node.value = option.value;
          node.textContent = option.label;
          if (option.value === value) node.selected = true;
          select.appendChild(node);
        });
        field.appendChild(label);
        field.appendChild(select);
        return { field: field, select: select };
      }

      function buildCheckbox(labelText, checked) {
        const field = document.createElement('div');
        field.className = 'sheet-field';
        const label = document.createElement('label');
        label.textContent = labelText;
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = Boolean(checked);
        input.style.minHeight = '20px';
        input.style.width = '20px';
        input.style.justifySelf = 'start';
        field.appendChild(label);
        field.appendChild(input);
        return { field: field, input: input };
      }

      function buildLabelEditor(labelText, value, numeric) {
        const field = document.createElement('div');
        field.className = 'sheet-field';
        const label = document.createElement('label');
        label.textContent = labelText;
        const mode = document.createElement('select');
        [{ value: 'hidden', label: '非表示' }, numeric ? { value: 'numeric', label: '数値' } : null, { value: 'text', label: '自由入力' }].filter(Boolean).forEach(function (option) {
          const node = document.createElement('option');
          node.value = option.value;
          node.textContent = option.label;
          if ((value === '' && option.value === 'hidden') || ((value === ' ' || value === '0') && option.value === 'numeric') || (value && value !== ' ' && value !== '0' && option.value === 'text')) node.selected = true;
          mode.appendChild(node);
        });
        const input = document.createElement('input');
        input.type = 'text';
        input.value = value && value !== ' ' && value !== '0' ? value : '';
        function sync() { input.disabled = mode.value !== 'text'; }
        mode.addEventListener('change', sync);
        field.appendChild(label);
        field.appendChild(mode);
        field.appendChild(input);
        sync();
        return { field: field, mode: mode, input: input };
      }

      function closeSheets() {
        editSheet.classList.remove('open');
        saveSheet.classList.remove('open');
        sheetBackdrop.classList.remove('open');
        editSheet.setAttribute('aria-hidden', 'true');
        saveSheet.setAttribute('aria-hidden', 'true');
        sheetBody.innerHTML = '';
      }

      function openSheet(kind, id) {
        closeSheets();
        if (kind === 'save') {
          saveSheet.classList.add('open');
          saveSheet.setAttribute('aria-hidden', 'false');
          sheetBackdrop.classList.add('open');
          return;
        }
        if (labelAdapter && labelAdapter.openEditSheet(kind, id)) return;
        sheetTitle.textContent = kind === 'point' ? (state.pointInputs[id] || id) : '線分 ' + id;
        let kindSelect = null;
        let arcCheckbox = null;
        if (kind === 'segment') {
          kindSelect = buildSelect('種類', state.segmentKinds[id] || 'plain', [
            { value: 'plain', label: '通常' },
            { value: 'circle', label: '丸付き' },
            { value: 'single', label: '一本線付き' },
            { value: 'double', label: '二重線付き' },
            { value: 'cross', label: '交差付き' },
            { value: 'triangle', label: '三角付き' },
            { value: 'parallel', label: '平行矢印付き' },
            { value: 'parallel-reverse', label: '平行矢印付き（逆向き）' },
            { value: 'parallel-single', label: '平行＋一本線付き' },
            { value: 'parallel-single-reverse', label: '平行＋一本線付き（逆向き）' },
            { value: 'parallel-double', label: '平行＋二重線付き' },
            { value: 'parallel-double-reverse', label: '平行＋二重線付き（逆向き）' }
          ]);
          sheetBody.appendChild(kindSelect.field);
          arcCheckbox = buildCheckbox('弧を表示', state.segmentArcVisible[id] !== false);
          sheetBody.appendChild(arcCheckbox.field);
        }
        const editor = buildLabelEditor('ラベル', kind === 'point' ? state.pointInputs[id] : state.segmentInputs[id], kind === 'segment');
        sheetBody.appendChild(editor.field);
        const hint = document.createElement('p');
        hint.className = 'sheet-hint';
        hint.textContent = kind === 'segment' ? '線分ラベルです。非表示、数値、自由入力を選べます。' : '点ラベルです。非表示または自由入力を選べます。';
        sheetBody.appendChild(hint);
        const actions = document.createElement('div');
        actions.className = 'sheet-actions';
        const cancel = document.createElement('button');
        cancel.className = 'btn';
        cancel.type = 'button';
        cancel.textContent = 'キャンセル';
        cancel.addEventListener('click', closeSheets);
        const save = document.createElement('button');
        save.className = 'btn action-primary';
        save.type = 'button';
        save.textContent = '保存';
        save.addEventListener('click', function () {
          if (kind === 'point') {
            state.pointInputs[id] = editor.mode.value === 'text' ? editor.input.value : '';
          } else {
            state.segmentKinds[id] = kindSelect.select.value;
            state.segmentArcVisible[id] = arcCheckbox.input.checked;
            state.segmentInputs[id] = editor.mode.value === 'hidden' ? '' : editor.mode.value === 'numeric' ? ' ' : editor.input.value;
          }
          closeSheets();
          render();
        });
        actions.appendChild(cancel);
        actions.appendChild(save);
        sheetBody.appendChild(actions);
        editSheet.classList.add('open');
        editSheet.setAttribute('aria-hidden', 'false');
        sheetBackdrop.classList.add('open');
      }

      async function saveAs(format) {
        const canvas = await html2canvas(captureRoot, { backgroundColor: format === 'transparent' ? null : '#ffffff', scale: 2 });
        if (format === 'png' || format === 'transparent') {
          const link = document.createElement('a');
          link.href = canvas.toDataURL('image/png');
          link.download = format === 'transparent' ? 'midpoint-theorem-3-transparent.png' : 'midpoint-theorem-3.png';
          link.click();
          return;
        }
        const jsPDF = window.jspdf && window.jspdf.jsPDF;
        const pdf = new jsPDF('portrait', 'mm', 'a4');
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        let drawW = pageW;
        let drawH = canvas.height * drawW / canvas.width;
        if (drawH > pageH) {
          drawH = pageH;
          drawW = canvas.width * drawH / canvas.height;
        }
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', (pageW - drawW) / 2, (pageH - drawH) / 2, drawW, drawH);
        pdf.save('midpoint-theorem-3.pdf');
      }

      Object.keys(inputs).forEach(function (key) { inputs[key].addEventListener('input', render); });
      backBtn.addEventListener('click', function () { window.history.back(); });
      saveBtn.addEventListener('click', function () { openSheet('save'); });
      sheetBackdrop.addEventListener('click', closeSheets);
      sheetClose.addEventListener('click', closeSheets);
      saveSheetClose.addEventListener('click', closeSheets);
      savePngBtn.addEventListener('click', function () { saveAs('png').then(closeSheets).catch(function (error) { setStatus(error.message || '保存に失敗しました。', true); }); });
      saveTransparentBtn.addEventListener('click', function () { saveAs('transparent').then(closeSheets).catch(function (error) { setStatus(error.message || '保存に失敗しました。', true); }); });
      savePdfBtn.addEventListener('click', function () { saveAs('pdf').then(closeSheets).catch(function (error) { setStatus(error.message || '保存に失敗しました。', true); }); });
      initLabelAdapter();
      render();
    })();
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
