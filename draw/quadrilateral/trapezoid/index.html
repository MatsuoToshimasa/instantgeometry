<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>台形 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/quadrilateral-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">台形</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status error" id="statusBox">上底・下底・高さ・左のずれを入力すると、台形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="台形の描画画面"></svg>
    </section>

    <footer class="bottom-bar">
      <div class="field">
        <div class="field-label">上底</div>
        <input class="field-input" id="topBaseInput" type="text" inputmode="decimal" value="4" />
      </div>
      <div class="field">
        <div class="field-label">下底</div>
        <input class="field-input" id="bottomBaseInput" type="text" inputmode="decimal" value="8" />
      </div>
      <div class="field">
        <div class="field-label">高さ</div>
        <input class="field-input" id="heightInput" type="text" inputmode="decimal" value="5" />
      </div>
      <div class="field">
        <div class="field-label">左のずれ</div>
        <input class="field-input" id="shiftInput" type="text" inputmode="decimal" value="1.5" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/quadrilateral-mobile-page.js"></script>
  <script>
    window.InstantGeometryQuadrilateralMobile.createPage({
      readyMessage: '入力をもとに台形を描画しています。',
      fileBase: 'quadrilateral-trapezoid',
      useRootSideLabels: true,
      controlInputIds: {
        topBase: 'topBaseInput',
        bottomBase: 'bottomBaseInput',
        height: 'heightInput',
        shift: 'shiftInput'
      },
      initialState: {
        pointInputs: { A: 'A', B: 'B', C: 'C', D: 'D' },
        sides: { AB: 0, BC: 8, CD: 0, DA: 4, MH: 5 },
        sideInputs: { AB: '', BC: ' ', CD: '', DA: ' ', MH: ' ' },
        sideKinds: { AB: 'plain', BC: 'plain', CD: 'plain', DA: 'plain', MH: 'plain' },
        sideArcVisible: { AB: false, BC: true, CD: false, DA: true, MH: true },
        angleInputs: { A: '', B: '', C: '', D: '' },
        angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden', D: 'hidden' },
        areaValue: ''
      },
      readControls: function (inputs, parsePositiveNumber) {
        return {
          topBase: parsePositiveNumber(inputs.topBase.value, '上底'),
          bottomBase: parsePositiveNumber(inputs.bottomBase.value, '下底'),
          height: parsePositiveNumber(inputs.height.value, '高さ'),
          shift: parsePositiveNumber(inputs.shift.value, '左のずれ')
        };
      },
      applyControlsToState: function () {},
      computeGeometry: function (state, parsed, helpers) {
        const geometry = helpers.finalizeGeometry({
          A: { x: (-parsed.topBase / 2) + (parsed.shift / 2), y: parsed.height / 2 },
          B: { x: -parsed.bottomBase / 2, y: -parsed.height / 2 },
          C: { x: parsed.bottomBase / 2, y: -parsed.height / 2 },
          D: { x: (parsed.topBase / 2) + (parsed.shift / 2), y: parsed.height / 2 }
        });
        state.sides.MH = parsed.height;
        return geometry;
      },
      drawAuxiliary: function (helpers) {
        const geometry = helpers.geometry;
        const state = helpers.state;
        const midpoint = {
          x: (geometry.A.x + geometry.D.x) / 2,
          y: (geometry.A.y + geometry.D.y) / 2
        };
        const foot = { x: midpoint.x, y: geometry.B.y };
        state.sides.MH = Math.hypot(midpoint.x - foot.x, midpoint.y - foot.y);
        state.sideDisplay = state.sideDisplay || {};
        state.sideDisplay.MH = helpers.formatLengthBetween(midpoint, foot);

        const start = helpers.fitPoint(midpoint);
        const end = helpers.fitPoint(foot);
        const line = helpers.createSvg('line', {
          x1: start.x,
          y1: start.y,
          x2: end.x,
          y2: end.y,
          stroke: '#687086',
          'stroke-width': '3',
          'stroke-dasharray': '8 7',
          'stroke-linecap': 'round'
        });
        helpers.attachHit(line, 'side', 'MH');
        helpers.stage.appendChild(line);
        helpers.stage.appendChild(helpers.createSvg('polyline', {
          points: [
            start.x + ',' + (start.y + 34),
            (start.x + 34) + ',' + (start.y + 34),
            (start.x + 34) + ',' + start.y
          ].join(' '),
          fill: 'none',
          stroke: '#687086',
          'stroke-width': '2.6',
          'stroke-linecap': 'round',
          'stroke-linejoin': 'round'
        }));
        helpers.stage.appendChild(helpers.createSvg('polyline', {
          points: [
            end.x + ',' + (end.y - 34),
            (end.x + 34) + ',' + (end.y - 34),
            (end.x + 34) + ',' + end.y
          ].join(' '),
          fill: 'none',
          stroke: '#687086',
          'stroke-width': '2.6',
          'stroke-linecap': 'round',
          'stroke-linejoin': 'round'
        }));

        const label = helpers.getSideLabelValue('MH');
        if (!label) return;
        const labelPoint = {
          x: (start.x + end.x) / 2 + 70,
          y: (start.y + end.y) / 2
        };
        if (state.sideArcVisible.MH !== false) {
          const geom = helpers.sideArcGeometry(start, end, helpers.screen.center, labelPoint);
          helpers.stage.appendChild(helpers.createSvg('path', {
            d: helpers.quadraticPathSegment(start, geom.control, end, 0, 0.5 - geom.gapHalf, 20),
            fill: 'none',
            stroke: '#2a5bd7',
            'stroke-width': '2',
            'stroke-linecap': 'round',
            'stroke-dasharray': '6 5'
          }));
          helpers.stage.appendChild(helpers.createSvg('path', {
            d: helpers.quadraticPathSegment(start, geom.control, end, 0.5 + geom.gapHalf, 1, 20),
            fill: 'none',
            stroke: '#2a5bd7',
            'stroke-width': '2',
            'stroke-linecap': 'round',
            'stroke-dasharray': '6 5'
          }));
        }
        const labelAttrs = {
          x: labelPoint.x,
          y: labelPoint.y,
          'text-anchor': 'middle',
          'dominant-baseline': 'middle',
          'font-size': '56',
          'font-weight': '700',
          fill: '#2a5bd7'
        };
        const textNode = helpers.createLabelNode ? helpers.createLabelNode(label, labelAttrs) : helpers.createSvg('text', labelAttrs);
        if (!helpers.createLabelNode) textNode.textContent = label;
        helpers.attachHit(textNode, 'side', 'MH');
        helpers.stage.appendChild(textNode);
      },
      sideNumericMode: function () {
        return 'readonly';
      },
      angleNumericMode: function () {
        return 'readonly';
      },
      updateSideControl: function () {},
      updateAngleControl: function () {}
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
