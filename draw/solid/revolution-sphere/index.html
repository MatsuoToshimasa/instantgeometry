<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>回転体③（球） | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/conic-mobile-page.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    .rotation-rect{fill:rgba(42,91,215,.08);stroke:#2a5bd7;stroke-width:3;stroke-linejoin:round}
    .rotation-axis{stroke:#1f2430;stroke-width:3.2;stroke-linecap:round}
    .rotation-axis-guide{stroke:#687086;stroke-width:2;stroke-linecap:round;stroke-dasharray:10 8}
    .rotation-side{stroke:#2a5bd7;stroke-width:2.4;stroke-linecap:round}
    .rotation-right-mark{fill:none;stroke:#687086;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">回転体③（球）</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">OA を入力すると、線分 XY のまわりに半円を回転する図を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="回転体③（球）の描画画面"></svg>
    </section>

    <footer class="bottom-bar">
      <div class="field">
        <div class="field-label">OA</div>
        <input class="field-input" id="oaInput" type="text" inputmode="decimal" value="3" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">x</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">x</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/solid-mobile-page.js"></script>
  <script>
    window.InstantGeometrySolidMobile.createSphereRotationPage({
      oaInputId: 'oaInput',
      fileBase: 'solid-revolution-sphere'
    });
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
