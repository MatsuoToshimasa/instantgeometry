<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>面積比② | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css?v=triangle-katex-6" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">面積比②</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">AP、PB、AQ、QC、BC から、P、Q と線分 PQ をもつ面積比②を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="面積比②の描画画面"></svg>
    </section>

    <footer class="bottom-bar five-fields">
      <div class="field">
        <div class="field-label">AP</div>
        <input class="field-input" id="apInput" type="text" inputmode="text" value="2" />
      </div>
      <div class="field">
        <div class="field-label">PB</div>
        <input class="field-input" id="pbInput" type="text" inputmode="text" value="3" />
      </div>
      <div class="field">
        <div class="field-label">AQ</div>
        <input class="field-input" id="aqInput" type="text" inputmode="text" value="3" />
      </div>
      <div class="field">
        <div class="field-label">QC</div>
        <input class="field-input" id="qcInput" type="text" inputmode="text" value="2" />
      </div>
      <div class="field">
        <div class="field-label">BC</div>
        <input class="field-input" id="bcInput" type="text" inputmode="text" value="6" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=triangle-katex-1"></script>
  <script src="../../../assets/function-svg-labels.js?v=triangle-katex-1"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/triangle-mobile-page.js?v=controller-17"></script>
  <script>
    (function () {
      'use strict';

      function pointOnSegment(P, Q, t) {
        return {
          x: P.x + (Q.x - P.x) * t,
          y: P.y + (Q.y - P.y) * t
        };
      }

      function segmentLength(P, Q) {
        return Math.hypot(P.x - Q.x, P.y - Q.y);
      }

      function angleDegrees(P, vertex, Q) {
        const ux = P.x - vertex.x;
        const uy = P.y - vertex.y;
        const vx = Q.x - vertex.x;
        const vy = Q.y - vertex.y;
        const size = Math.hypot(ux, uy) * Math.hypot(vx, vy);
        if (!size) return 0;
        const cosine = Math.max(-1, Math.min(1, (ux * vx + uy * vy) / size));
        return Math.acos(cosine) * 180 / Math.PI;
      }

      function polygonArea(points) {
        let areaTwice = 0;
        points.forEach(function (point, index) {
          const next = points[(index + 1) % points.length];
          areaTwice += point.x * next.y - next.x * point.y;
        });
        return Math.abs(areaTwice) / 2;
      }

      function segmentLabelPoint(P, Q, center, distance) {
        const midpoint = { x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2 };
        const dx = Q.x - P.x;
        const dy = Q.y - P.y;
        const length = Math.hypot(dx, dy) || 1;
        let nx = -dy / length;
        let ny = dx / length;
        if (nx * (center.x - midpoint.x) + ny * (center.y - midpoint.y) > 0) {
          nx *= -1;
          ny *= -1;
        }
        return {
          x: midpoint.x + nx * (distance || 0.42),
          y: midpoint.y + ny * (distance || 0.42)
        };
      }

      function pointLabelNearSide(point, P, Q, center, distance) {
        const dx = Q.x - P.x;
        const dy = Q.y - P.y;
        const length = Math.hypot(dx, dy) || 1;
        let nx = -dy / length;
        let ny = dx / length;
        if (nx * (center.x - point.x) + ny * (center.y - point.y) > 0) {
          nx *= -1;
          ny *= -1;
        }
        return {
          x: point.x + nx * (distance || 0.44),
          y: point.y + ny * (distance || 0.44)
        };
      }

      function buildAreaRatioGeometry(values) {
        const AB = values.AP + values.PB;
        const AC = values.AQ + values.QC;
        if (AB + AC <= values.BC || AB + values.BC <= AC || AC + values.BC <= AB) {
          throw new Error('AP+PB、AQ+QC、BC が三角形を作れる値になるようにしてください。');
        }
        const B = { x: 0, y: 0 };
        const C = { x: values.BC, y: 0 };
        const ax = (AB * AB + values.BC * values.BC - AC * AC) / (2 * values.BC);
        const ay = Math.sqrt(Math.max(0, AB * AB - ax * ax));
        const A = { x: ax, y: ay };
        const P = pointOnSegment(A, B, values.AP / AB);
        const Q = pointOnSegment(A, C, values.AQ / AC);
        const angleA = angleDegrees(B, A, C);
        const angleB = angleDegrees(C, B, A);
        const angleC = 180 - angleA - angleB;
        return Object.assign({ A: A, B: B, C: C, P: P, Q: Q, AB: AB, AC: AC, angleA: angleA, angleB: angleB, angleC: angleC }, values, {
          PQ: segmentLength(P, Q),
          areaAPQ: polygonArea([A, P, Q]),
          areaPQCB: polygonArea([P, Q, C, B])
        });
      }

      function splitSegments(geometry) {
        const center = {
          x: (geometry.A.x + geometry.B.x + geometry.C.x) / 3,
          y: (geometry.A.y + geometry.B.y + geometry.C.y) / 3
        };
        return [
          { id: 'PQ', name: 'PQ', p1: geometry.P, p2: geometry.Q, stroke: '#25603b', strokeWidth: 3, dasharray: null },
          { id: 'AP', name: 'AP', p1: geometry.A, p2: geometry.P, drawLine: false, value: geometry.AP, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.A, geometry.P, center, 0.42) },
          { id: 'PB', name: 'PB', p1: geometry.P, p2: geometry.B, drawLine: false, value: geometry.PB, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.P, geometry.B, center, 0.42) },
          { id: 'AQ', name: 'AQ', p1: geometry.A, p2: geometry.Q, drawLine: false, value: geometry.AQ, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.A, geometry.Q, center, 0.42) },
          { id: 'QC', name: 'QC', p1: geometry.Q, p2: geometry.C, drawLine: false, value: geometry.QC, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.Q, geometry.C, center, 0.42) }
        ];
      }

      window.InstantGeometryTriangleMobile.createPage({
        readyMessage: 'AP、PB、AQ、QC、BC から面積比②を描画しました。',
        fileBase: 'area-ratio-2',
        controlInputIds: {
          AP: 'apInput',
          PB: 'pbInput',
          AQ: 'aqInput',
          QC: 'qcInput',
          BC: 'bcInput'
        },
        initialState: {
          sides: { a: 6, b: 5, c: 5 },
          pointInputs: { A: 'A', B: 'B', C: 'C', P: 'P', Q: 'Q' },
          sideInputs: { a: ' ', b: '', c: '' },
          sideKinds: { a: 'plain', b: 'plain', c: 'plain' },
          sideArcVisible: { a: true, b: true, c: true },
          angleInputs: { A: '', B: '', C: '' },
          angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden' },
          areaValue: '',
          areaColor: '#ffffff',
          extraAreaInputs: { APQ: '', PQCB: '' },
          extraAreaColors: { APQ: '#2a5bd7', PQCB: '#2e7d32' },
          extraSegmentInputs: { PQ: '', AP: ' ', PB: ' ', AQ: ' ', QC: ' ' },
          extraSegmentKinds: { PQ: 'plain', AP: 'plain', PB: 'plain', AQ: 'plain', QC: 'plain' },
          extraSegmentArcVisible: { PQ: false, AP: true, PB: true, AQ: true, QC: true }
        },
        readControls: function (inputs, parseNatural) {
          return {
            AP: parseNatural(inputs.AP.value, 'AP'),
            PB: parseNatural(inputs.PB.value, 'PB'),
            AQ: parseNatural(inputs.AQ.value, 'AQ'),
            QC: parseNatural(inputs.QC.value, 'QC'),
            BC: parseNatural(inputs.BC.value, 'BC')
          };
        },
        applyControlsToState: function (state, parsed) {
          state.sides.a = parsed.BC;
          state.sides.b = parsed.AQ + parsed.QC;
          state.sides.c = parsed.AP + parsed.PB;
        },
        computeGeometry: function (state, parsed) {
          return buildAreaRatioGeometry(parsed);
        },
        extraAreas: function (context) {
          const g = context.geometry;
          return [
            { id: 'APQ', name: '△APQ', points: [g.A, g.P, g.Q], color: '#2a5bd7', value: g.areaAPQ },
            { id: 'PQCB', name: 'PQCB', points: [g.P, g.Q, g.C, g.B], color: '#2e7d32', value: g.areaPQCB }
          ];
        },
        extraPoints: function (context) {
          const g = context.geometry;
          const center = { x: (g.A.x + g.B.x + g.C.x) / 3, y: (g.A.y + g.B.y + g.C.y) / 3 };
          return [
            { id: 'P', point: g.P, labelPoint: pointLabelNearSide(g.P, g.A, g.B, center, 0.44), fill: '#25603b' },
            { id: 'Q', point: g.Q, labelPoint: pointLabelNearSide(g.Q, g.A, g.C, center, 0.44), fill: '#25603b' }
          ];
        },
        extraSegments: function (context) {
          return splitSegments(context.geometry);
        }
      });
    })();
  </script>
  <script src="/assets/site-auto-i18n.js?v=triangle-katex-1"></script>
</body>
</html>
