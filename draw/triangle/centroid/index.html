<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>重心 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css?v=triangle-katex-7" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">重心</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">3辺から三角形の重心を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="重心の描画画面"></svg>
    </section>

    <footer class="bottom-bar">
      <div class="field">
        <div class="field-label">辺 a（BC）</div>
        <input class="field-input" id="sideA" type="text" inputmode="text" value="5" />
      </div>
      <div class="field">
        <div class="field-label">辺 b（CA）</div>
        <input class="field-input" id="sideB" type="text" inputmode="text" value="6" />
      </div>
      <div class="field">
        <div class="field-label">辺 c（AB）</div>
        <input class="field-input" id="sideC" type="text" inputmode="text" value="7" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=triangle-katex-1"></script>
  <script src="../../../assets/function-svg-labels.js?v=triangle-katex-1"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/triangle-mobile-page.js?v=controller-17"></script>
  <script>
    window.InstantGeometryTriangleMobile.createPage({
      readyMessage: '入力をもとに重心を描画しています。',
      fileBase: 'triangle-centroid',
      centerType: 'centroid',
      centerLabel: 'G',
      controlInputIds: {
        a: 'sideA',
        b: 'sideB',
        c: 'sideC'
      },
      initialState: {
        sides: { a: 5, b: 6, c: 7 },
        pointInputs: { A: 'A', B: 'B', C: 'C', G: 'G', P: '', Q: '', R: '' },
        sideInputs: { a: ' ', b: ' ', c: ' ' },
        sideKinds: { a: 'plain', b: 'plain', c: 'plain' },
        sideArcVisible: { a: true, b: true, c: true },
        angleInputs: { A: '', B: '', C: '' },
        angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden' },
        extraAreaInputs: { ABG: '', BCG: '', CAG: '' },
        extraSegmentInputs: { GP: 'ratio:r,1', GQ: 'ratio:s,1', GR: 'ratio:t,1', BP: '', CP: '', CQ: '', QA: '', AR: '', RB: '' },
        extraSegmentKinds: { GP: 'plain', GQ: 'plain', GR: 'plain', BP: 'circle', CP: 'circle', CQ: 'double', QA: 'double', AR: 'single', RB: 'single' },
        centerLineInputs: { A: 'ratio:r,2', B: 'ratio:s,2', C: 'ratio:t,2' },
        areaValue: ' '
      },
      readControls: function (inputs, parseNatural) {
        return {
          a: parseNatural(inputs.a.value, '辺 a'),
          b: parseNatural(inputs.b.value, '辺 b'),
          c: parseNatural(inputs.c.value, '辺 c')
        };
      },
      applyControlsToState: function (state, parsed) {
        state.sides.a = parsed.a;
        state.sides.b = parsed.b;
        state.sides.c = parsed.c;
      },
      computeGeometry: function (state, parsed, helpers) {
        return helpers.computeTriangleFromSides(parsed.a, parsed.b, parsed.c);
      },
      formatAreaLabel: function (state, geometry, helpers) {
        return helpers.formatHeronArea(state.sides.a, state.sides.b, state.sides.c);
      },
      extraAreas: function (context) {
        const geometry = context.geometry;
        const G = window.InstantGeometryTriangleMobile.helpers.triangleCenterPoint(geometry, 'centroid');
        function areaValue(P, Q, R) {
          return function (helpers) {
            return helpers.formatPreferredNumber(helpers.pointTriangleArea(P, Q, R));
          };
        }
        return [
          {
            id: 'ABG',
            name: '△ABG',
            points: [geometry.A, geometry.B, G],
            labelPoint: {
              x: (geometry.A.x + geometry.B.x + G.x) / 3,
              y: (geometry.A.y + geometry.B.y + G.y) / 3
            },
            value: areaValue(geometry.A, geometry.B, G)
          },
          {
            id: 'BCG',
            name: '△BCG',
            points: [geometry.B, geometry.C, G],
            labelPoint: {
              x: (geometry.B.x + geometry.C.x + G.x) / 3,
              y: (geometry.B.y + geometry.C.y + G.y) / 3
            },
            value: areaValue(geometry.B, geometry.C, G)
          },
          {
            id: 'CAG',
            name: '△CAG',
            points: [geometry.C, geometry.A, G],
            labelPoint: {
              x: (geometry.C.x + geometry.A.x + G.x) / 3,
              y: (geometry.C.y + geometry.A.y + G.y) / 3
            },
            value: areaValue(geometry.C, geometry.A, G)
          }
        ];
      },
      extraSegments: function (context) {
        const geometry = context.geometry;
        const G = window.InstantGeometryTriangleMobile.helpers.triangleCenterPoint(geometry, 'centroid');
        const P = {
          x: (geometry.B.x + geometry.C.x) / 2,
          y: (geometry.B.y + geometry.C.y) / 2
        };
        const Q = {
          x: (geometry.C.x + geometry.A.x) / 2,
          y: (geometry.C.y + geometry.A.y) / 2
        };
        const R = {
          x: (geometry.A.x + geometry.B.x) / 2,
          y: (geometry.A.y + geometry.B.y) / 2
        };
        function segmentValue(endPoint) {
          return function (helpers) {
            return helpers.formatPreferredNumber(Math.hypot(G.x - endPoint.x, G.y - endPoint.y));
          };
        }
        return [
          { id: 'GP', name: 'GP', p1: G, p2: P, value: segmentValue(P) },
          { id: 'GQ', name: 'GQ', p1: G, p2: Q, value: segmentValue(Q) },
          { id: 'GR', name: 'GR', p1: G, p2: R, value: segmentValue(R) },
          { id: 'BP', name: 'BP', p1: geometry.B, p2: P, drawLine: false },
          { id: 'CP', name: 'CP', p1: geometry.C, p2: P, drawLine: false },
          { id: 'CQ', name: 'CQ', p1: geometry.C, p2: Q, drawLine: false },
          { id: 'QA', name: 'QA', p1: Q, p2: geometry.A, drawLine: false },
          { id: 'AR', name: 'AR', p1: geometry.A, p2: R, drawLine: false },
          { id: 'RB', name: 'RB', p1: R, p2: geometry.B, drawLine: false }
        ];
      },
      extraPoints: function (context) {
        const geometry = context.geometry;
        return [
          {
            id: 'P',
            point: {
              x: (geometry.B.x + geometry.C.x) / 2,
              y: (geometry.B.y + geometry.C.y) / 2
            }
          },
          {
            id: 'Q',
            point: {
              x: (geometry.C.x + geometry.A.x) / 2,
              y: (geometry.C.y + geometry.A.y) / 2
            }
          },
          {
            id: 'R',
            point: {
              x: (geometry.A.x + geometry.B.x) / 2,
              y: (geometry.A.y + geometry.B.y) / 2
            }
          }
        ];
      },
      sideNumericMode: function () {
        return 'control';
      },
      angleNumericMode: function () {
        return 'readonly';
      },
      updateSideControl: function (id, value, state, inputs) {
        inputs[id].value = String(value);
        state.sides[id] = value;
      },
      updateAngleControl: function () {}
    });
  </script>
  <script src="/assets/site-auto-i18n.js?v=triangle-katex-1"></script>
</body>
</html>
