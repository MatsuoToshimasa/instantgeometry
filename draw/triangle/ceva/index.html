<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>チェバの定理 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css?v=triangle-katex-6" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">チェバの定理</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">BL、CL、CM、AM を入力すると、チェバの定理に合わせて AN、BN を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="チェバの定理の描画画面"></svg>
    </section>

    <footer class="bottom-bar four-fields">
      <div class="field">
        <div class="field-label">BL</div>
        <input class="field-input" id="blInput" type="text" inputmode="text" value="2" />
      </div>
      <div class="field">
        <div class="field-label">CL</div>
        <input class="field-input" id="clInput" type="text" inputmode="text" value="3" />
      </div>
      <div class="field">
        <div class="field-label">CM</div>
        <input class="field-input" id="cmInput" type="text" inputmode="text" value="4" />
      </div>
      <div class="field">
        <div class="field-label">AM</div>
        <input class="field-input" id="amInput" type="text" inputmode="text" value="5" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=triangle-katex-1"></script>
  <script src="../../../assets/function-svg-labels.js?v=triangle-katex-1"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/triangle-mobile-page.js?v=controller-17"></script>
  <script>
    (function () {
      'use strict';

      function gcd(a, b) {
        let x = Math.abs(Math.round(a));
        let y = Math.abs(Math.round(b));
        while (y) {
          const r = x % y;
          x = y;
          y = r;
        }
        return x || 1;
      }

      function pointOnSegment(P, Q, t) {
        return {
          x: P.x + (Q.x - P.x) * t,
          y: P.y + (Q.y - P.y) * t
        };
      }

      function lineIntersection(P, Q, R, S) {
        const vx = Q.x - P.x;
        const vy = Q.y - P.y;
        const wx = S.x - R.x;
        const wy = S.y - R.y;
        const denominator = vx * wy - vy * wx;
        if (Math.abs(denominator) < 1e-10) {
          throw new Error('交点を計算できません。入力値を確認してください。');
        }
        const t = ((R.x - P.x) * wy - (R.y - P.y) * wx) / denominator;
        return {
          x: P.x + vx * t,
          y: P.y + vy * t
        };
      }

      function buildCevaGeometry(values) {
        const base = values.BL + values.CL;
        const B = { x: 0, y: 0 };
        const C = { x: base, y: 0 };
        const ca = values.CM + values.AM;
        const horizontal = ca * 0.55;
        const A = {
          x: C.x - horizontal,
          y: Math.sqrt(Math.max(0, ca * ca - horizontal * horizontal))
        };
        const L = pointOnSegment(B, C, values.BL / (values.BL + values.CL));
        const M = pointOnSegment(C, A, values.CM / (values.CM + values.AM));
        const O = lineIntersection(A, L, B, M);
        const N = lineIntersection(C, O, A, B);
        const AN = segmentLength(A, N);
        const BN = segmentLength(B, N);
        const angleA = angleDegrees(B, A, C);
        const angleB = angleDegrees(C, B, A);
        const angleC = 180 - angleA - angleB;
        return Object.assign({ A: A, B: B, C: C, angleA: angleA, angleB: angleB, angleC: angleC }, values, {
          L: L,
          M: M,
          N: N,
          O: O,
          AN: AN,
          BN: BN
        });
      }

      function angleDegrees(P, vertex, Q) {
        const ux = P.x - vertex.x;
        const uy = P.y - vertex.y;
        const vx = Q.x - vertex.x;
        const vy = Q.y - vertex.y;
        const length = Math.hypot(ux, uy) * Math.hypot(vx, vy);
        if (!length) return 0;
        const cosine = Math.max(-1, Math.min(1, (ux * vx + uy * vy) / length));
        return Math.acos(cosine) * 180 / Math.PI;
      }

      function segmentLength(P, Q) {
        return Math.hypot(P.x - Q.x, P.y - Q.y);
      }

      function segmentLabelPoint(P, Q, center, distance) {
        const midpoint = { x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2 };
        const dx = Q.x - P.x;
        const dy = Q.y - P.y;
        const length = Math.hypot(dx, dy) || 1;
        let nx = -dy / length;
        let ny = dx / length;
        if (nx * (center.x - midpoint.x) + ny * (center.y - midpoint.y) > 0) {
          nx *= -1;
          ny *= -1;
        }
        return {
          x: midpoint.x + nx * (distance || 0.36),
          y: midpoint.y + ny * (distance || 0.36)
        };
      }

      function cevaSegments(geometry) {
        const center = {
          x: (geometry.A.x + geometry.B.x + geometry.C.x) / 3,
          y: (geometry.A.y + geometry.B.y + geometry.C.y) / 3
        };
        return [
          { id: 'AL', name: 'AO', p1: geometry.A, p2: geometry.L, stroke: '#25603b', dasharray: '8 7' },
          { id: 'BM', name: 'BO', p1: geometry.B, p2: geometry.M, stroke: '#25603b', dasharray: '8 7' },
          { id: 'CN', name: 'CO', p1: geometry.C, p2: geometry.N, stroke: '#25603b', dasharray: '8 7' },
          { id: 'BL', name: 'BL', p1: geometry.B, p2: geometry.L, drawLine: false, value: geometry.BL, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.B, geometry.L, center, 0.42) },
          { id: 'CL', name: 'CL', p1: geometry.C, p2: geometry.L, drawLine: false, value: geometry.CL, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.C, geometry.L, center, 0.42) },
          { id: 'CM', name: 'CM', p1: geometry.C, p2: geometry.M, drawLine: false, value: geometry.CM, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.C, geometry.M, center, 0.42) },
          { id: 'AM', name: 'AM', p1: geometry.A, p2: geometry.M, drawLine: false, value: geometry.AM, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.A, geometry.M, center, 0.42) },
          { id: 'AN', name: 'AN', p1: geometry.A, p2: geometry.N, drawLine: false, value: geometry.AN, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.A, geometry.N, center, 0.42) },
          { id: 'BN', name: 'BN', p1: geometry.B, p2: geometry.N, drawLine: false, value: geometry.BN, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.B, geometry.N, center, 0.42) }
        ];
      }

      window.InstantGeometryTriangleMobile.createPage({
        readyMessage: 'BL、CL、CM、AM からチェバの定理の図を描画しました。',
        fileBase: 'triangle-ceva',
        controlInputIds: {
          BL: 'blInput',
          CL: 'clInput',
          CM: 'cmInput',
          AM: 'amInput'
        },
        initialState: {
          sides: { a: 5, b: 6, c: 7 },
          pointInputs: { A: 'A', B: 'B', C: 'C', L: 'L', M: 'M', N: 'N', O: 'O' },
          sideInputs: { a: '', b: '', c: '' },
          sideKinds: { a: 'plain', b: 'plain', c: 'plain' },
          sideArcVisible: { a: true, b: true, c: true },
          angleInputs: { A: '', B: '', C: '' },
          angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden' },
          extraSegmentInputs: { AL: '', BM: '', CN: '', BL: ' ', CL: ' ', CM: ' ', AM: ' ', AN: ' ', BN: ' ' },
          extraSegmentKinds: { AL: 'plain', BM: 'plain', CN: 'plain', BL: 'plain', CL: 'plain', CM: 'plain', AM: 'plain', AN: 'plain', BN: 'plain' },
          extraSegmentArcVisible: { AL: false, BM: false, CN: false, BL: true, CL: true, CM: true, AM: true, AN: true, BN: true },
          areaValue: ''
        },
        readControls: function (inputs, parseNatural) {
          return {
            BL: parseNatural(inputs.BL.value, 'BL'),
            CL: parseNatural(inputs.CL.value, 'CL'),
            CM: parseNatural(inputs.CM.value, 'CM'),
            AM: parseNatural(inputs.AM.value, 'AM')
          };
        },
        applyControlsToState: function (state, parsed) {
          state.sides.a = parsed.BL + parsed.CL;
          state.sides.b = parsed.CM + parsed.AM;
          state.sides.c = parsed.CL + parsed.AM;
        },
        computeGeometry: function (state, parsed) {
          return buildCevaGeometry(parsed);
        },
        extraPoints: function (context) {
          const geometry = context.geometry;
          return [
            { id: 'L', point: geometry.L, labelPoint: { x: geometry.L.x, y: geometry.L.y - 0.5 }, fill: '#25603b' },
            { id: 'M', point: geometry.M, labelPoint: { x: geometry.M.x + 0.5, y: geometry.M.y + 0.1 }, fill: '#25603b' },
            { id: 'N', point: geometry.N, labelPoint: { x: geometry.N.x - 0.45, y: geometry.N.y + 0.2 }, fill: '#25603b' },
            { id: 'O', point: geometry.O, labelPoint: { x: geometry.O.x + 0.42, y: geometry.O.y + 0.35 }, fill: '#b42318', radius: 7 }
          ];
        },
        extraSegments: function (context) {
          return cevaSegments(context.geometry);
        }
      });
    })();
  </script>
  <script src="/assets/site-auto-i18n.js?v=triangle-katex-1"></script>
</body>
</html>
