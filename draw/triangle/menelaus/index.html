<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>メネラウスの定理 | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css?v=triangle-katex-6" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">メネラウスの定理</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">AN、BN、BC、CL を入力すると、メネラウスの定理に合わせて M を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="メネラウスの定理の描画画面"></svg>
    </section>

    <footer class="bottom-bar four-fields">
      <div class="field">
        <div class="field-label">AN</div>
        <input class="field-input" id="anInput" type="text" inputmode="text" value="1" />
      </div>
      <div class="field">
        <div class="field-label">BN</div>
        <input class="field-input" id="bnInput" type="text" inputmode="text" value="2" />
      </div>
      <div class="field">
        <div class="field-label">BC</div>
        <input class="field-input" id="bcInput" type="text" inputmode="text" value="3" />
      </div>
      <div class="field">
        <div class="field-label">CL</div>
        <input class="field-input" id="clInput" type="text" inputmode="text" value="4" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=triangle-katex-1"></script>
  <script src="../../../assets/function-svg-labels.js?v=triangle-katex-1"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/triangle-mobile-page.js?v=controller-17"></script>
  <script>
    (function () {
      'use strict';

      function pointOnSegment(P, Q, t) {
        return {
          x: P.x + (Q.x - P.x) * t,
          y: P.y + (Q.y - P.y) * t
        };
      }

      function gcd(a, b) {
        let x = Math.abs(Math.round(a));
        let y = Math.abs(Math.round(b));
        while (y) {
          const r = x % y;
          x = y;
          y = r;
        }
        return x || 1;
      }

      function lineIntersection(P, Q, R, S) {
        const vx = Q.x - P.x;
        const vy = Q.y - P.y;
        const wx = S.x - R.x;
        const wy = S.y - R.y;
        const denominator = vx * wy - vy * wx;
        if (Math.abs(denominator) < 1e-10) {
          throw new Error('交点を計算できません。入力値を確認してください。');
        }
        const t = ((R.x - P.x) * wy - (R.y - P.y) * wx) / denominator;
        return {
          x: P.x + vx * t,
          y: P.y + vy * t
        };
      }

      function angleDegrees(P, vertex, Q) {
        const ux = P.x - vertex.x;
        const uy = P.y - vertex.y;
        const vx = Q.x - vertex.x;
        const vy = Q.y - vertex.y;
        const length = Math.hypot(ux, uy) * Math.hypot(vx, vy);
        if (!length) return 0;
        const cosine = Math.max(-1, Math.min(1, (ux * vx + uy * vy) / length));
        return Math.acos(cosine) * 180 / Math.PI;
      }

      function segmentLength(P, Q) {
        return Math.hypot(P.x - Q.x, P.y - Q.y);
      }

      function segmentLabelPoint(P, Q, center, distance) {
        const midpoint = { x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2 };
        const dx = Q.x - P.x;
        const dy = Q.y - P.y;
        const length = Math.hypot(dx, dy) || 1;
        let nx = -dy / length;
        let ny = dx / length;
        if (nx * (center.x - midpoint.x) + ny * (center.y - midpoint.y) > 0) {
          nx *= -1;
          ny *= -1;
        }
        return {
          x: midpoint.x + nx * (distance || 0.36),
          y: midpoint.y + ny * (distance || 0.36)
        };
      }

      function buildMenelausGeometry(values) {
        const height = values.AN + values.BN;
        const A = { x: 0, y: height };
        const B = { x: 0, y: 0 };
        const C = { x: values.BC, y: 0 };
        const L = { x: values.BC + values.CL, y: 0 };
        const N = pointOnSegment(A, B, values.AN / (values.AN + values.BN));
        const M = lineIntersection(L, N, C, A);
        const lmRaw = values.CL * (values.AN + values.BN);
        const mnRaw = values.AN * values.BC;
        const divisor = gcd(lmRaw, mnRaw);
        const angleA = angleDegrees(B, A, C);
        const angleB = angleDegrees(C, B, A);
        const angleC = 180 - angleA - angleB;
        return Object.assign({ A: A, B: B, C: C, angleA: angleA, angleB: angleB, angleC: angleC }, values, {
          L: L,
          M: M,
          N: N,
          LM: segmentLength(L, M),
          MN: segmentLength(M, N),
          LMRatio: lmRaw / divisor,
          MNRatio: mnRaw / divisor
        });
      }

      function menelausSegments(geometry) {
        const center = {
          x: (geometry.A.x + geometry.B.x + geometry.C.x) / 3,
          y: (geometry.A.y + geometry.B.y + geometry.C.y) / 3
        };
        const lineCenter = {
          x: (geometry.L.x + geometry.N.x) / 2,
          y: (geometry.L.y + geometry.N.y) / 2
        };
        return [
          { id: 'CLext', name: 'BCの延長', p1: geometry.C, p2: geometry.L, stroke: '#7f8aa3', strokeWidth: 3, dasharray: '9 7' },
          { id: 'LN', name: 'LN', p1: geometry.L, p2: geometry.N, stroke: '#25603b', strokeWidth: 3, dasharray: 'none' },
          { id: 'AN', name: 'AN', p1: geometry.A, p2: geometry.N, drawLine: false, value: geometry.AN, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.A, geometry.N, center, 0.44) },
          { id: 'BN', name: 'BN', p1: geometry.B, p2: geometry.N, drawLine: false, value: geometry.BN, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.B, geometry.N, center, 0.44) },
          { id: 'BC', name: 'BC', p1: geometry.B, p2: geometry.C, drawLine: false, value: geometry.BC, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.B, geometry.C, center, 0.44) },
          { id: 'CL', name: 'CL', p1: geometry.C, p2: geometry.L, drawLine: false, value: geometry.CL, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.C, geometry.L, center, 0.44) },
          { id: 'LM', name: 'LM', p1: geometry.L, p2: geometry.M, drawLine: false, value: function (context) { return 'ratio:r,' + context.geometry.LMRatio; }, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.L, geometry.M, lineCenter, 0.44) },
          { id: 'MN', name: 'MN', p1: geometry.M, p2: geometry.N, drawLine: false, value: function (context) { return 'ratio:r,' + context.geometry.MNRatio; }, stroke: '#2a5bd7', labelPoint: segmentLabelPoint(geometry.M, geometry.N, lineCenter, 0.44) }
        ];
      }

      window.InstantGeometryTriangleMobile.createPage({
        readyMessage: 'AN、BN、BC、CL からメネラウスの定理の図を描画しました。',
        fileBase: 'triangle-menelaus',
        controlInputIds: {
          AN: 'anInput',
          BN: 'bnInput',
          BC: 'bcInput',
          CL: 'clInput'
        },
        initialState: {
          sides: { a: 5, b: 6, c: 7 },
          pointInputs: { A: 'A', B: 'B', C: 'C', L: 'L', M: 'M', N: 'N' },
          sideInputs: { a: '', b: '', c: '' },
          sideKinds: { a: 'plain', b: 'plain', c: 'plain' },
          sideArcVisible: { a: true, b: true, c: true },
          angleInputs: { A: '', B: '', C: '' },
          angleKinds: { A: 'hidden', B: 'hidden', C: 'hidden' },
          extraSegmentInputs: { CLext: '', LN: '', AN: ' ', BN: ' ', BC: ' ', CL: ' ', LM: ' ', MN: ' ' },
          extraSegmentKinds: { CLext: 'plain', LN: 'plain', AN: 'plain', BN: 'plain', BC: 'plain', CL: 'plain', LM: 'plain', MN: 'plain' },
          extraSegmentArcVisible: { CLext: false, LN: false, AN: true, BN: true, BC: true, CL: true, LM: true, MN: true },
          areaValue: ''
        },
        readControls: function (inputs, parseNatural) {
          return {
            AN: parseNatural(inputs.AN.value, 'AN'),
            BN: parseNatural(inputs.BN.value, 'BN'),
            BC: parseNatural(inputs.BC.value, 'BC'),
            CL: parseNatural(inputs.CL.value, 'CL')
          };
        },
        applyControlsToState: function (state, parsed) {
          state.sides.a = parsed.BC;
          state.sides.b = parsed.BC + parsed.CL;
          state.sides.c = parsed.AN + parsed.BN;
        },
        computeGeometry: function (state, parsed) {
          return buildMenelausGeometry(parsed);
        },
        extraPoints: function (context) {
          const geometry = context.geometry;
          return [
            { id: 'L', point: geometry.L, labelPoint: { x: geometry.L.x + 0.42, y: geometry.L.y - 0.36 }, fill: '#25603b' },
            { id: 'M', point: geometry.M, labelPoint: { x: geometry.M.x + 0.36, y: geometry.M.y + 0.28 }, fill: '#25603b' },
            { id: 'N', point: geometry.N, labelPoint: { x: geometry.N.x - 0.42, y: geometry.N.y - 0.1 }, fill: '#25603b' }
          ];
        },
        extraSegments: function (context) {
          return menelausSegments(context.geometry);
        }
      });
    })();
  </script>
  <script src="/assets/site-auto-i18n.js?v=triangle-katex-1"></script>
</body>
</html>
