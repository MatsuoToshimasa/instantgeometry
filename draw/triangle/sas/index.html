<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>三角形（SAS） | Instant Geometry</title>
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css?v=triangle-katex-6" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="/assets/save-quota.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">三角形（SAS）</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">２辺とその間の角を入力すると、三角形を自動で描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="三角形（SAS）の描画画面"></svg>
    </section>

    <footer class="bottom-bar">
      <div class="field">
        <div class="field-label">辺 b（CA）</div>
        <input class="field-input" id="sideB" type="text" inputmode="text" value="6" />
      </div>
      <div class="field">
        <div class="field-label">角 A（∠BAC）</div>
        <input class="field-input" id="angleAInput" type="text" inputmode="text" value="60" />
      </div>
      <div class="field">
        <div class="field-label">辺 c（AB）</div>
        <input class="field-input" id="sideC" type="text" inputmode="text" value="7" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=triangle-katex-1"></script>
  <script src="../../../assets/function-svg-labels.js?v=triangle-katex-1"></script>
  <script src="../../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../../assets/triangle-mobile-page.js?v=controller-17"></script>
  <script>
    window.InstantGeometryTriangleMobile.createPage({
      readyMessage: '入力をもとに三角形を描画しています。',
      fileBase: 'triangle-sas',
      controlInputIds: {
        b: 'sideB',
        A: 'angleAInput',
        c: 'sideC'
      },
      initialState: {
        sides: { a: 0, b: 6, c: 7 },
        independentAngles: { A: 60 },
        pointInputs: { A: 'A', B: 'B', C: 'C' },
        sideInputs: { a: '', b: ' ', c: ' ' },
        sideKinds: { a: 'plain', b: 'plain', c: 'plain' },
        sideArcVisible: { a: true, b: true, c: true },
        angleInputs: { A: ' ', B: '', C: '' },
        angleKinds: { A: 'plain', B: 'hidden', C: 'hidden' },
        areaValue: ''
      },
      readControls: function (inputs, parseNatural) {
        return {
          b: parseNatural(inputs.b.value, '辺 b'),
          A: parseNatural(inputs.A.value, '角 A'),
          c: parseNatural(inputs.c.value, '辺 c')
        };
      },
      applyControlsToState: function (state, parsed) {
        state.sides.b = parsed.b;
        state.sides.c = parsed.c;
        state.independentAngles.A = parsed.A;
      },
      computeGeometry: function (state, parsed, helpers) {
        const geometry = helpers.computeTriangleFromSAS(parsed.b, parsed.A, parsed.c);
        state.sides.a = Math.hypot(geometry.B.x - geometry.C.x, geometry.B.y - geometry.C.y);
        return geometry;
      },
      sideNumericMode: function (id) {
        return id === 'b' || id === 'c' ? 'control' : 'readonly';
      },
      angleNumericMode: function (id) {
        return id === 'A' ? 'control' : 'readonly';
      },
      updateSideControl: function (id, value, state, inputs) {
        inputs[id].value = String(value);
        state.sides[id] = value;
      },
      updateAngleControl: function (id, value, state, inputs) {
        inputs[id].value = String(value);
        state.independentAngles[id] = value;
      }
    });
  </script>
  <script src="/assets/site-auto-i18n.js?v=triangle-katex-1"></script>
</body>
</html>
