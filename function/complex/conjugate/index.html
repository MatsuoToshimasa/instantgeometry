<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Complex Conjugate | Instant Geometry</title>
  <meta name="description" content="複素数 z と共役複素数 conj(z) を表示し、実軸対称と絶対値の円を確認します。" />
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css" />
  <link rel="stylesheet" href="../../../assets/function-complex-page.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app function-complex-app">
    <header class="topbar"><div class="topbar-tools"><button class="btn" id="backBtn" type="button">戻る</button><button class="btn icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙</button></div><h1 class="topbar-title">共役複素数</h1><button class="btn" id="saveBtn" type="button">保存</button></header>
    <section class="stage-wrap function-stage-wrap" id="captureRoot"><div class="status" id="statusBox">z と conj(z) の実軸対称を表示します。</div><svg class="stage function-complex-stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="共役複素数の描画画面"></svg></section>
    <div class="complex-readout" id="readout"></div>
    <footer class="bottom-bar two-fields" id="bottomBar"></footer>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title" id="sheetTitle">設定</h2><button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body" id="sheetBody"></div></section>
  <section class="sheet" id="saveSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title">保存</h2><button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body"><div class="save-grid"><button class="btn" id="savePngBtn" type="button">PNG</button><button class="btn" id="saveTransparentBtn" type="button">透過PNG</button><button class="btn" id="savePdfBtn" type="button">PDF</button></div></div></section>
  <script>
    window.InstantGeometryComplexConfig = {
      kind: 'conjugate',
      slug: 'function-complex-conjugate',
      variables: [{ id: 'z', re: 3, im: 2, reLabel: 'z 実部', imLabel: 'z 虚部' }],
      targets: [
        { key: 'pointZ', type: 'point', title: '点 z', defaultLabel: 'z', color: '#e25555' },
        { key: 'pointConj', type: 'point', title: '点 conj(z)', defaultLabel: 'conj(z)', color: '#2e7d32' },
        { key: 'vectorOz', type: 'vector', title: 'ベクトル Oz', defaultLabel: 'Oz', color: '#2a5bd7' },
        { key: 'vectorConj', type: 'vector', title: 'ベクトル O conj(z)', defaultLabel: 'O conj(z)', color: '#2e7d32' },
        { key: 'symmetry', type: 'segment', title: '実軸対称', defaultLabel: '実軸対称', color: '#8e44ad' },
        { key: 'modCircle', type: 'circle', title: '|z| の円', defaultLabel: '|z|', color: '#d97706' }
      ]
    };
  </script>
  <script src="../../../assets/function-complex-core.js"></script>
  <script src="../../../assets/function-complex-page.js"></script>
  <script src="../../../assets/function-svg-labels.js"></script>
  <script src="../../../assets/site-auto-i18n.js"></script>
</body>
</html>
