<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ax² + Bxy + Cy² + Dx + Ey + F = 0 | Instant Geometry</title>
  <meta name="description" content="係数 A, B, C, D, E, F を入力して、一般形の二次曲線 Ax² + Bxy + Cy² + Dx + Ey + F = 0 を描画します。" />
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css" />
  <link rel="stylesheet" href="../../../assets/function-linear-page.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app function-linear-app">
    <header class="topbar">
      <div class="topbar-tools">
        <button class="btn" id="backBtn" type="button">戻る</button>
        <button class="btn icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙</button>
      </div>
      <h1 class="topbar-title">Ax² + Bxy + Cy² + Dx + Ey + F = 0</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap function-stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">係数 A, B, C, D, E, F を入力すると、一般形の二次曲線を描画します。</div>
      <svg class="stage function-stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="Ax² + Bxy + Cy² + Dx + Ey + F = 0 の描画画面"></svg>
    </section>

    <footer class="bottom-bar six-fields">
      <div class="field">
        <div class="field-label">A</div>
        <input class="field-input" id="coefA" type="text" inputmode="decimal" value="1" />
      </div>
      <div class="field">
        <div class="field-label">B</div>
        <input class="field-input" id="coefB" type="text" inputmode="decimal" value="0" />
      </div>
      <div class="field">
        <div class="field-label">C</div>
        <input class="field-input" id="coefC" type="text" inputmode="decimal" value="1" />
      </div>
      <div class="field">
        <div class="field-label">D</div>
        <input class="field-input" id="coefD" type="text" inputmode="decimal" value="0" />
      </div>
      <div class="field">
        <div class="field-label">E</div>
        <input class="field-input" id="coefE" type="text" inputmode="decimal" value="0" />
      </div>
      <div class="field">
        <div class="field-label">F</div>
        <input class="field-input" id="coefF" type="text" inputmode="decimal" value="-9" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/function-conic-general-form-page.js"></script>
  <script src="../../../assets/function-svg-labels.js"></script>
  <script src="../../../assets/site-auto-i18n.js"></script>
</body>
</html>
