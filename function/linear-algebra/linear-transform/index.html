<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>一次変換 R² → R² | Instant Geometry</title>
  <meta name="description" content="A = [[a,b],[c,d]] による R² から R² への一次変換を表示します。" />
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css" />
  <link rel="stylesheet" href="../../../assets/function-linear-page.css" />
  <link rel="stylesheet" href="../../../assets/linear-algebra-page.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app linear-algebra-app">
    <header class="topbar"><div class="topbar-tools"><button class="btn" id="backBtn" type="button">戻る</button><button class="btn icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙</button></div><h1 class="topbar-title">一次変換 R² → R²</h1><button class="btn" id="saveBtn" type="button">保存</button></header>
    <section class="stage-wrap function-stage-wrap" id="captureRoot"><div class="status" id="statusBox">A による一次変換を表示します。</div><svg class="stage linear-algebra-stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="一次変換の描画画面"></svg></section>
    <div class="linear-algebra-readout" id="readout"></div>
    <div class="la-playbar" id="playbar" hidden><button class="btn" id="playBtn" type="button">再生</button><button class="btn" id="resetBtn" type="button">リセット</button><input id="tSlider" type="range" min="0" max="1" step="0.01" value="1" /><span>t</span></div>
    <footer class="bottom-bar six-fields" id="bottomBar"></footer>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title" id="sheetTitle">設定</h2><button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body" id="sheetBody"></div></section>
  <section class="sheet" id="saveSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title">保存</h2><button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body"><div class="save-grid"><button class="btn" id="savePngBtn" type="button">PNG</button><button class="btn" id="saveTransparentBtn" type="button">透過PNG</button><button class="btn" id="savePdfBtn" type="button">PDF</button></div></div></section>
  <script>window.InstantGeometryLinearAlgebraConfig = { mapType: 'r2-to-r2', defaultViewMode: 'animated', slug: 'linear-algebra-linear-transform', fields: [{ id: 'a', label: 'a', value: 1 }, { id: 'b', label: 'b', value: 1 }, { id: 'c', label: 'c', value: 0 }, { id: 'd', label: 'd', value: 1 }, { id: 'x', label: 'v x', value: 2 }, { id: 'y', label: 'v y', value: 1 }] };</script>
  <script src="../../../assets/linear-algebra-page.js"></script><script src="../../../assets/function-svg-labels.js"></script>
  <script src="../../../assets/site-auto-i18n.js"></script>
</body>
</html>
