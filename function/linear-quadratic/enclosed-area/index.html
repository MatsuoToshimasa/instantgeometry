<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>囲まれた面積 | Instant Geometry</title>
  <meta name="description" content="二次関数 y = ax² + bx + c と、点Pを通り傾きmの一次関数で囲まれる面積を描画します。" />
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css" />
  <link rel="stylesheet" href="../../../assets/function-linear-page.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app function-linear-app">
    <header class="topbar">
      <div class="topbar-tools">
        <button class="btn" id="backBtn" type="button">戻る</button>
        <button class="btn icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙</button>
      </div>
      <h1 class="topbar-title">囲まれた面積</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap function-stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">二次関数と、点Pを通り傾きmの直線で囲まれる面積を描画します。</div>
      <svg class="stage function-stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="二次関数と直線で囲まれる面積の描画画面"></svg>
    </section>

    <footer class="bottom-bar six-fields">
      <div class="field">
        <div class="field-label">係数 a</div>
        <input class="field-input" id="coefA" type="text" inputmode="decimal" value="0.1" />
      </div>
      <div class="field">
        <div class="field-label">係数 b</div>
        <input class="field-input" id="coefB" type="text" inputmode="decimal" value="0" />
      </div>
      <div class="field">
        <div class="field-label">定数 c</div>
        <input class="field-input" id="constC" type="text" inputmode="decimal" value="0" />
      </div>
      <div class="field">
        <div class="field-label">P x</div>
        <input class="field-input" id="pointPX" type="text" inputmode="decimal" value="0" />
      </div>
      <div class="field">
        <div class="field-label">P y</div>
        <input class="field-input" id="pointPY" type="text" inputmode="decimal" value="6" />
      </div>
      <div class="field">
        <div class="field-label">傾き m</div>
        <input class="field-input" id="lineM" type="text" inputmode="decimal" value="0.5" />
      </div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title" id="sheetTitle">設定</h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header">
      <h2 class="sheet-title">保存</h2>
      <button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body">
      <div class="save-grid">
        <button class="btn" id="savePngBtn" type="button">PNG</button>
        <button class="btn" id="saveTransparentBtn" type="button">透過PNG</button>
        <button class="btn" id="savePdfBtn" type="button">PDF</button>
      </div>
    </div>
  </section>

  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script>
  <script src="../../../assets/function-view-settings.js"></script>
  <script src="../../../assets/function-linear-quadratic-enclosed-area-page.js"></script>
  <script src="../../../assets/function-svg-labels.js"></script>
  <script src="../../../assets/site-auto-i18n.js"></script>
</body>
</html>
