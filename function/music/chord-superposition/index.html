<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>和音の重ね合わせ | Instant Geometry</title>
  <meta name="description" content="基準音と3つの周波数比を足し合わせた和音波形を描画します。" />
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css" />
  <link rel="stylesheet" href="../../../assets/function-linear-page.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app function-linear-app">
    <header class="topbar"><div class="topbar-tools"><button class="btn" id="backBtn" type="button">戻る</button><button class="btn icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙</button></div><h1 class="topbar-title">和音の重ね合わせ</h1><button class="btn" id="saveBtn" type="button">保存</button></header>
    <section class="stage-wrap function-stage-wrap" id="captureRoot"><div class="status" id="statusBox">基準音と3つの周波数比を足し合わせた波形を描画します。</div><svg class="stage function-stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="和音の重ね合わせの描画画面"></svg></section>
    <footer class="bottom-bar five-fields"><div class="field"><div class="field-label">振幅 A</div><input class="field-input" id="axisA" type="text" inputmode="decimal" value="3" /></div><div class="field"><div class="field-label">基準周波数 f₀</div><input class="field-input" id="axisB" type="text" inputmode="decimal" value="2" /></div><div class="field"><div class="field-label">比 r₂</div><input class="field-input" id="axisC" type="text" inputmode="decimal" value="1.25" /></div><div class="field"><div class="field-label">比 r₃</div><input class="field-input" id="axisD" type="text" inputmode="decimal" value="1.5" /></div><div class="field"><div class="field-label">比 r₄</div><input class="field-input" id="axisE" type="text" inputmode="decimal" value="2" /></div></footer>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div><section class="sheet" id="editSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title" id="sheetTitle">設定</h2><button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body" id="sheetBody"></div></section><section class="sheet" id="saveSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title">保存</h2><button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body"><div class="save-grid"><button class="btn" id="savePngBtn" type="button">PNG</button><button class="btn" id="saveTransparentBtn" type="button">透過PNG</button><button class="btn" id="savePdfBtn" type="button">PDF</button></div></div></section>
  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script><script src="../../../assets/function-view-settings.js"></script>
  <script>window.InstantGeometryAdvancedFunctionConfig = { kind: 'music-chord-superposition', saveBase: 'function-music-chord-superposition', statusText: '基準音と3つの周波数比を足し合わせた波形を描画します。', params: ['a','b','c','d','e'], defaults: { a: 3, b: 2, c: 1.25, d: 1.5, e: 2 }, defaultViewCenterX: 0, defaultViewCenterY: 0, defaultViewWidth: 5, defaultViewHeight: 7, labels: { a: '振幅 A', b: '基準周波数 f₀', c: '比 r₂', d: '比 r₃', e: '比 r₄' } };</script>
  <script src="../../../assets/function-advanced-page.js"></script>
  <script src="../../../assets/function-svg-labels.js"></script><script src="../../../assets/site-auto-i18n.js"></script>
</body>
</html>
