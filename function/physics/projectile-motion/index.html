<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>放物運動 | Instant Geometry</title>
  <meta name="description" content="初速度、角度、初期高さ、重力加速度から放物運動の軌道を描画します。" />
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css" />
  <link rel="stylesheet" href="../../../assets/function-linear-page.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app function-linear-app">
    <header class="topbar"><div class="topbar-tools"><button class="btn" id="backBtn" type="button">戻る</button><button class="btn icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙</button></div><h1 class="topbar-title">放物運動</h1><button class="btn" id="saveBtn" type="button">保存</button></header>
    <section class="stage-wrap function-stage-wrap" id="captureRoot"><div class="status" id="statusBox">初速度 v、角度 θ、初期高さ h、重力加速度 g から投射軌道を描画します。</div><svg class="stage function-stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="放物運動の描画画面"></svg></section>
    <footer class="bottom-bar four-fields"><div class="field"><div class="field-label">初速度 v</div><input class="field-input" id="axisA" type="text" inputmode="decimal" value="14" /></div><div class="field"><div class="field-label">角度 θ°</div><input class="field-input" id="axisB" type="text" inputmode="decimal" value="45" /></div><div class="field"><div class="field-label">初期高さ h</div><input class="field-input" id="axisC" type="text" inputmode="decimal" value="0" /></div><div class="field"><div class="field-label">重力加速度 g</div><input class="field-input" id="axisD" type="text" inputmode="decimal" value="9.8" /></div></footer>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div><section class="sheet" id="editSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title" id="sheetTitle">設定</h2><button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body" id="sheetBody"></div></section><section class="sheet" id="saveSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title">保存</h2><button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body"><div class="save-grid"><button class="btn" id="savePngBtn" type="button">PNG</button><button class="btn" id="saveTransparentBtn" type="button">透過PNG</button><button class="btn" id="savePdfBtn" type="button">PDF</button></div></div></section>
  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script><script src="../../../assets/function-view-settings.js"></script>
  <script>window.InstantGeometryAdvancedFunctionConfig = { kind: 'physics-projectile-motion', saveBase: 'function-physics-projectile-motion', statusText: '初速度 v、角度 θ、初期高さ h、重力加速度 g から投射軌道を描画します。', params: ['a','b','c','d'], defaults: { a: 14, b: 45, c: 0, d: 9.8 }, tickLabelInterval: 2, defaultViewCenterX: 10, defaultViewCenterY: 4, defaultViewWidth: 24, defaultViewHeight: 14, labels: { a: '初速度 v', b: '角度 θ°', c: '初期高さ h', d: '重力加速度 g' } };</script>
  <script src="../../../assets/function-advanced-page.js"></script>
  <script src="../../../assets/function-svg-labels.js"></script><script src="../../../assets/site-auto-i18n.js"></script>
</body>
</html>
