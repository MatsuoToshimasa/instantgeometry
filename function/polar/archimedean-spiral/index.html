<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>アルキメデスの螺旋 | Instant Geometry</title>
  <meta name="description" content="極座標 r = a + bθ のアルキメデスの螺旋を描画します。" />
  <link rel="stylesheet" href="../../../assets/triangle-mobile-page.css" />
  <link rel="stylesheet" href="../../../assets/function-linear-page.css" />
  <script src="/assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app function-linear-app">
    <header class="topbar"><div class="topbar-tools"><button class="btn" id="backBtn" type="button">戻る</button><button class="btn icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙</button></div><h1 class="topbar-title">アルキメデスの螺旋</h1><button class="btn" id="saveBtn" type="button">保存</button></header>
    <section class="stage-wrap function-stage-wrap" id="captureRoot"><div class="status" id="statusBox">r = a + bθ を描画します。</div><svg class="stage function-stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="アルキメデスの螺旋の描画画面"></svg></section>
    <footer class="bottom-bar two-fields"><div class="field"><div class="field-label">係数 a</div><input class="field-input" id="axisA" type="text" inputmode="decimal" value="0" /></div><div class="field"><div class="field-label">係数 b</div><input class="field-input" id="axisB" type="text" inputmode="decimal" value="0.4" /></div></footer>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div><section class="sheet" id="editSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title" id="sheetTitle">設定</h2><button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body" id="sheetBody"></div></section><section class="sheet" id="saveSheet" aria-hidden="true"><div class="sheet-header"><h2 class="sheet-title">保存</h2><button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button></div><div class="sheet-body"><div class="save-grid"><button class="btn" id="savePngBtn" type="button">PNG</button><button class="btn" id="saveTransparentBtn" type="button">透過PNG</button><button class="btn" id="savePdfBtn" type="button">PDF</button></div></div></section>
  <script src="../../../assets/mobile-angle-ornaments.js?v=angle-modal-1"></script><script src="../../../assets/function-view-settings.js"></script>
  <script>window.InstantGeometryAdvancedFunctionConfig = { kind: 'polar', polarType: 'archimedean-spiral', saveBase: 'function-polar-archimedean-spiral', statusText: 'r = a + bθ を描画します。', params: ['a','b'], defaults: { a: 0, b: 0.4 }, thetaMin: 0, thetaMax: 6 * Math.PI, thetaSteps: 2400, defaultCoordinateMode: 'polar', defaultViewWidth: 28, defaultViewHeight: 28, labels: { a: '係数 a', b: '係数 b' } };</script>
  <script src="../../../assets/function-advanced-page.js"></script>
  <script src="../../../assets/function-svg-labels.js"></script><script src="../../../assets/site-auto-i18n.js"></script>
</body>
</html>
