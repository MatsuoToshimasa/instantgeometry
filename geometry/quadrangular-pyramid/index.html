<!DOCTYPE html>
<html lang="ja" data-geometry-figure-model="figure.quadrangularPyramid" data-grade-tags="小6,中1" data-topic-tags="空間図形,構成要素" data-purpose-tags="定義,関係">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>四角錐 | Instant Geometry</title>
  <link rel="canonical" href="https://www.instantgeometry.com/geometry/quadrangular-pyramid/" />
  <link rel="stylesheet" href="../../assets/conic-mobile-page.css" />
  <link rel="stylesheet" href="../../assets/geometry-solid-detail.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="../../assets/save-quota.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn" id="backBtn" type="button">戻る</button>
      <h1 class="topbar-title">四角錐</h1>
      <button class="btn" id="saveBtn" type="button">保存</button>
    </header>

    <section class="stage-wrap" id="captureRoot">
      <div class="status" id="statusBox">BC、CD、DE、EB、AHを入力すると、四角錐を描画します。</div>
      <svg class="stage" id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="四角錐の描画画面"></svg>
      <div id="labelLayer" aria-hidden="true"></div>
    </section>

    <footer class="bottom-bar five-fields">
      <div class="field"><div class="field-label">BC</div><input class="field-input" id="bcInput" type="text" inputmode="decimal" value="5" /></div>
      <div class="field"><div class="field-label">CD</div><input class="field-input" id="cdInput" type="text" inputmode="decimal" value="6" /></div>
      <div class="field"><div class="field-label">DE</div><input class="field-input" id="deInput" type="text" inputmode="decimal" value="5" /></div>
      <div class="field"><div class="field-label">EB</div><input class="field-input" id="ebInput" type="text" inputmode="decimal" value="6" /></div>
      <div class="field"><div class="field-label">AH</div><input class="field-input" id="ahInput" type="text" inputmode="decimal" value="7" /></div>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="sheet" id="editSheet" aria-hidden="true">
    <div class="sheet-header"><h2 class="sheet-title" id="sheetTitle">設定</h2><button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">×</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <section class="sheet" id="saveSheet" aria-hidden="true">
    <div class="sheet-header"><h2 class="sheet-title">保存</h2><button class="sheet-close" id="saveSheetClose" type="button" aria-label="閉じる">×</button></div>
    <div class="sheet-body"><div class="save-grid"><button class="btn" id="savePngBtn" type="button">PNG</button><button class="btn" id="saveTransparentBtn" type="button">透過PNG</button><button class="btn" id="savePdfBtn" type="button">PDF</button></div></div>
  </section>

  <script type="application/json" id="geometryFigureModel">{"model":"figure.quadrangularPyramid","adopted":true}</script>
  <script src="../../assets/draw-shared-labels.js?v=shared-katex-2"></script>
  <script src="../../assets/mobile-angle-ornaments.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="../../assets/draw-label-taxonomy.js?v=taxonomy-1"></script>
  <script src="../../assets/draw-shared-label-engine.js?v=controller-1"></script>
  <script src="../../assets/solid-mobile-page.js"></script>
  <script>
    window.InstantGeometrySolidMobile.createQuadrangularPyramidPage({
      bcInputId: 'bcInput',
      cdInputId: 'cdInput',
      deInputId: 'deInput',
      ebInputId: 'ebInput',
      ahInputId: 'ahInput',
      fileBase: 'geometry-quadrangular-pyramid'
    });
  </script>
  <script src="../../assets/draw-geometry-role-definitions.js?v=role-defs-1"></script>
  <script src="../../assets/draw-page-schema-adapter.js?v=schema-adapter-2"></script>
  <script src="../../assets/draw-settings.js?v=settings-contract-1"></script>
  <script src="/assets/site-auto-i18n.js?v=settings-contract-1"></script>
</body>
</html>
