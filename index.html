<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Geometry</title>
  <meta name="description" content="Instant Geometry は、三角形・四角形・円・楕円などを条件入力からすぐ描ける、数学教育向けの無料図形作図ツールです。" />
  <meta name="google-site-verification" content="4cgJHQ7JPUxt7vcbEIvOfi7a_HeQBFVl9RC-XrXhkho" />
  <link rel="canonical" href="https://www.instantgeometry.com/" />
  <meta property="og:title" content="Instant Geometry" />
  <meta property="og:description" content="三角形・四角形・円・楕円などを条件入力からすぐ描ける、数学教育向けの無料図形作図ツールです。" />
  <meta property="og:url" content="https://www.instantgeometry.com/" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/assets/base.css" />
  <style>
    :root{
      --bg:#f6f7fb;
      --panel:#ffffff;
      --line:#d9dce7;
      --text:#1f2430;
      --muted:#687086;
      --accent:#2a5bd7;
      --accent-soft:#eef3ff;
      --shadow:0 10px 28px rgba(27,39,94,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      background:linear-gradient(180deg,#f8faff 0%,#f4f6fb 100%);
      color:var(--text);
    }

    a{color:inherit;text-decoration:none}

    .wrap{
      width:min(1080px,calc(100% - 32px));
      margin:0 auto;
    }

    .hero{
      min-height:calc(100vh - 96px);
      display:grid;
      align-content:center;
      gap:28px;
      padding:48px 0;
    }

    h1{
      margin:0;
      max-width:820px;
      font-size:clamp(38px,7vw,76px);
      line-height:1.05;
      letter-spacing:0;
    }

    .lead{
      max-width:720px;
      margin:0;
      color:var(--muted);
      font-size:17px;
      line-height:1.9;
    }

    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 18px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      font-weight:700;
      box-shadow:0 6px 18px rgba(27,39,94,.06);
    }

    .btn.primary{
      border-color:var(--accent);
      background:var(--accent);
      color:#fff;
    }

    .btn.function{
      border-color:#b9c7ef;
      background:var(--accent-soft);
      color:var(--accent);
    }

    .btn.settings{
      border-color:#cfd7ea;
      color:var(--muted);
    }

    .btn.pricing{
      border-color:#cfd7ea;
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      margin-top:12px;
    }

    .card{
      min-height:132px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .card strong{
      display:block;
      margin-bottom:8px;
      font-size:18px;
    }

    .card span{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }

    @media (max-width: 760px){
      .hero{align-content:start;padding-top:32px}
      .grid{grid-template-columns:1fr}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="site-header"></div>
  </div>

  <main class="wrap hero">
    <h1>条件を入れて、図形をすぐ描く。</h1>
    <p class="lead">
      Instant Geometry は、三角形・四角形・円や楕円をスマホSafariで扱いやすい形に整理した作図ツールです。
      まずは対応済みの図形からWeb版として公開しています。
    </p>
    <div class="actions">
      <a class="btn primary" href="/draw/">図形を描く</a>
      <a class="btn function" href="/function/">関数を描く</a>
      <a class="btn settings" href="/settings/">表示設定</a>
      <a class="btn pricing" href="/pricing/">料金プラン</a>
    </div>
    <section class="grid" aria-label="対応済みカテゴリ">
      <a class="card" href="/draw/#triangles">
        <strong>三角形</strong>
        <span>SSS、SAS、ASA、直角三角形などを入力から描画します。</span>
      </a>
      <a class="card" href="/draw/#quadrilaterals">
        <strong>四角形</strong>
        <span>正方形、長方形、台形、平行四辺形、一般四角形に対応しています。</span>
      </a>
      <a class="card" href="/draw/#curves">
        <strong>曲線図形</strong>
        <span>円、楕円、扇形、楕円の扇形を描画できます。</span>
      </a>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabase-client.js"></script>
  <script src="/assets/auth-helpers.js"></script>
  <script src="/assets/auth-ui.js"></script>
  <script src="/assets/components.js"></script>
  <script>
    (function () {
      'use strict';

      const translations = {
        ja: {
          title: 'Instant Geometry',
          heroTitle: '条件を入れて、図形をすぐ描く。',
          heroLead: 'Instant Geometry は、三角形・四角形・円や楕円をスマホSafariで扱いやすい形に整理した作図ツールです。まずは対応済みの図形からWeb版として公開しています。',
          draw: '図形を描く',
          functions: '関数を描く',
          settings: '表示設定',
          pricing: '料金プラン',
          aria: '対応済みカテゴリ',
          cards: [
            ['三角形', 'SSS、SAS、ASA、直角三角形などを入力から描画します。'],
            ['四角形', '正方形、長方形、台形、平行四辺形、一般四角形に対応しています。'],
            ['曲線図形', '円、楕円、扇形、楕円の扇形を描画できます。']
          ]
        },
        en: {
          title: 'Instant Geometry',
          heroTitle: 'Enter conditions and draw shapes instantly.',
          heroLead: 'Instant Geometry is a drawing tool organized for smartphone Safari, starting with triangles, quadrilaterals, circles, and ellipses. The web version currently focuses on supported shapes.',
          draw: 'Draw Shapes',
          functions: 'Graph Functions',
          settings: 'Display Settings',
          pricing: 'Pricing',
          aria: 'Supported categories',
          cards: [
            ['Triangles', 'Draw from SSS, SAS, ASA, right triangle conditions, and more.'],
            ['Quadrilaterals', 'Supports squares, rectangles, trapezoids, parallelograms, and general quadrilaterals.'],
            ['Curved Shapes', 'Draw circles, ellipses, sectors, and elliptic sectors.']
          ]
        },
        zh: {
          title: 'Instant Geometry',
          heroTitle: '输入条件，立即绘制图形。',
          heroLead: 'Instant Geometry 是为手机 Safari 整理的绘图工具，当前 Web 版先支持三角形、四边形、圆和椭圆等图形。',
          draw: '绘制图形',
          functions: '绘制函数',
          settings: '显示设置',
          pricing: '价格方案',
          aria: '已支持的分类',
          cards: [
            ['三角形', '可根据 SSS、SAS、ASA、直角三角形等条件绘制。'],
            ['四边形', '支持正方形、长方形、梯形、平行四边形和一般四边形。'],
            ['曲线图形', '可以绘制圆、椭圆、扇形和椭圆扇形。']
          ]
        },
        es: {
          title: 'Instant Geometry',
          heroTitle: 'Introduce condiciones y dibuja figuras al instante.',
          heroLead: 'Instant Geometry es una herramienta de dibujo organizada para Safari en smartphone. La versión web comienza con triángulos, cuadriláteros, círculos y elipses compatibles.',
          draw: 'Dibujar figuras',
          functions: 'Graficar funciones',
          settings: 'Ajustes de visualización',
          pricing: 'Precios',
          aria: 'Categorías compatibles',
          cards: [
            ['Triángulos', 'Dibuja con condiciones SSS, SAS, ASA, triángulos rectángulos y más.'],
            ['Cuadriláteros', 'Admite cuadrados, rectángulos, trapecios, paralelogramos y cuadriláteros generales.'],
            ['Figuras curvas', 'Dibuja círculos, elipses, sectores y sectores elípticos.']
          ]
        }
      };

      function getLang() {
        if (window.siteI18n && typeof window.siteI18n.getLanguage === 'function') {
          return window.siteI18n.getLanguage();
        }
        return document.documentElement.lang || 'ja';
      }

      function applyHomeTranslations() {
        const t = translations[getLang()] || translations.ja;
        document.title = t.title;
        const h1 = document.querySelector('.hero h1');
        const lead = document.querySelector('.lead');
        const drawLink = document.querySelector('.actions .primary');
        const functionLink = document.querySelector('.actions .function');
        const settingsLink = document.querySelector('.actions .settings');
        const pricingLink = document.querySelector('.actions .pricing');
        const grid = document.querySelector('.grid');
        if (h1) h1.textContent = t.heroTitle;
        if (lead) lead.textContent = t.heroLead;
        if (drawLink) drawLink.textContent = t.draw;
        if (functionLink) functionLink.textContent = t.functions;
        if (settingsLink) settingsLink.textContent = t.settings;
        if (pricingLink) pricingLink.textContent = t.pricing;
        if (grid) grid.setAttribute('aria-label', t.aria);
        document.querySelectorAll('.card').forEach(function (card, index) {
          const data = t.cards[index];
          if (!data) return;
          const strong = card.querySelector('strong');
          const span = card.querySelector('span');
          if (strong) strong.textContent = data[0];
          if (span) span.textContent = data[1];
        });
      }

      document.addEventListener('site-components:ready', applyHomeTranslations);
      document.addEventListener('site-language:changed', applyHomeTranslations);
      applyHomeTranslations();
    })();
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
