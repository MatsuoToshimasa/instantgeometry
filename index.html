<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工事中 | Instant Geometry</title>
  <link rel="stylesheet" href="/assets/base.css" />
  <style>
    :root{
      --bg:#f6f7fb;
      --panel:#ffffff;
      --line:#d9dce7;
      --text:#1f2430;
      --muted:#687086;
      --accent:#2a5bd7;
      --accent-soft:#eef3ff;
      --shadow:0 10px 28px rgba(27,39,94,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      background:linear-gradient(180deg,#f8faff 0%,#f4f6fb 100%);
      color:var(--text);
    }

    .shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(680px,100%);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:40px 32px;
      text-align:center;
    }

    .badge{
      display:inline-block;
      margin-bottom:18px;
      padding:8px 14px;
      border-radius:999px;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:13px;
      font-weight:700;
      letter-spacing:.04em;
    }

    h1{
      margin:0 0 14px;
      font-size:38px;
      line-height:1.2;
    }

    p{
      margin:0;
      color:var(--muted);
      font-size:16px;
      line-height:1.9;
    }

    @media (max-width: 640px){
      .card{
        padding:32px 22px;
      }

      h1{
        font-size:30px;
      }

      p{
        font-size:15px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="maintenance">
      <div class="badge">MAINTENANCE</div>
      <h1>工事中</h1>
      <p>
        Instant Geometry は現在、設計の見直しと再構築を進めています。<br />
        しばらくの間、トップページは工事中表示とします。
      </p>
    </section>
  </main>
</body>
</html>
