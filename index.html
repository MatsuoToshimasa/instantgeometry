<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Geometry</title>
  <meta name="description" content="Instant Geometry は、体系学習、数理描画、問題作成をつなぐ数学教育向けのWebツールです。" />
  <meta name="google-site-verification" content="4cgJHQ7JPUxt7vcbEIvOfi7a_HeQBFVl9RC-XrXhkho" />
  <link rel="canonical" href="https://www.instantgeometry.com/" />
  <meta property="og:title" content="Instant Geometry" />
  <meta property="og:description" content="体系学習、数理描画、問題作成をつなぐ数学教育向けのWebツールです。" />
  <meta property="og:url" content="https://www.instantgeometry.com/" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/assets/base.css" />
  <style>
    :root{
      --bg:#f6f7fb;
      --panel:#ffffff;
      --line:#d9dce7;
      --text:#1f2430;
      --muted:#687086;
      --accent:#2a5bd7;
      --accent-soft:#eef3ff;
      --shadow:0 10px 28px rgba(27,39,94,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      background:linear-gradient(180deg,#f8faff 0%,#f4f6fb 100%);
      color:var(--text);
    }

    a{color:inherit;text-decoration:none}

    .wrap{
      width:min(1080px,calc(100% - 32px));
      margin:0 auto;
    }

    .hero{
      min-height:calc(100vh - 96px);
      display:grid;
      align-content:center;
      gap:28px;
      padding:48px 0;
    }

    h1{
      margin:0;
      max-width:820px;
      font-size:clamp(38px,7vw,76px);
      line-height:1.05;
      letter-spacing:0;
    }

    .lead{
      max-width:720px;
      margin:0;
      color:var(--muted);
      font-size:17px;
      line-height:1.9;
    }

    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 18px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      font-weight:700;
      box-shadow:0 6px 18px rgba(27,39,94,.06);
    }

    .btn.primary{
      border-color:var(--accent);
      background:var(--accent);
      color:#fff;
    }

    .btn.function{
      border-color:#b9c7ef;
      background:var(--accent-soft);
      color:var(--accent);
    }

    .btn.settings{
      border-color:#cfd7ea;
      color:var(--muted);
    }

    .btn.pricing{
      border-color:#cfd7ea;
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      margin-top:12px;
    }

    .card{
      min-height:132px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .card strong{
      display:block;
      margin-bottom:8px;
      font-size:18px;
    }

    .card span{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }

    @media (max-width: 760px){
      .hero{align-content:start;padding-top:32px}
      .grid{grid-template-columns:1fr}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="site-header"></div>
  </div>

  <main class="wrap hero">
    <h1>学ぶ、描く、問題を作る。</h1>
    <p class="lead">
      Instant Geometry は、定義や定理を学ぶページ、数学的対象を描くページ、問題を作るページを
      目的別に整理していく数学教育向けのWebツールです。
    </p>
    <div class="actions">
      <a class="btn primary" href="/learn/">体系学習</a>
      <a class="btn function" href="/draw/">数理描画</a>
      <a class="btn pricing" href="/problems/">問題作成</a>
    </div>
    <section class="grid" aria-label="主要導線">
      <a class="card" href="/learn/">
        <strong>体系学習</strong>
        <span>定義、性質、定理、公式、条件、典型例、注意、証明を説明ページとして整理します。</span>
      </a>
      <a class="card" href="/draw/">
        <strong>数理描画</strong>
        <span>図形描画、関数描画、グラフ描画、作図、ラベル調整、保存を扱います。</span>
      </a>
      <a class="card" href="/problems/">
        <strong>問題作成</strong>
        <span>受験問題、複雑図形、面積分解、条件付き出題、解説生成を育てます。</span>
      </a>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/supabase-client.js"></script>
  <script src="/assets/auth-helpers.js"></script>
  <script src="/assets/auth-ui.js"></script>
  <script src="/assets/components.js"></script>
  <script>
    (function () {
      'use strict';

      const translations = {
        ja: {
          title: 'Instant Geometry',
          heroTitle: '学ぶ、描く、問題を作る。',
          heroLead: 'Instant Geometry は、定義や定理を学ぶページ、数学的対象を描くページ、問題を作るページを目的別に整理していく数学教育向けのWebツールです。',
          learn: '体系学習',
          draw: '数理描画',
          problems: '問題作成',
          aria: '主要導線',
          cards: [
            ['体系学習', '定義、性質、定理、公式、条件、典型例、注意、証明を説明ページとして整理します。'],
            ['数理描画', '図形描画、関数描画、グラフ描画、作図、ラベル調整、保存を扱います。'],
            ['問題作成', '受験問題、複雑図形、面積分解、条件付き出題、解説生成を育てます。']
          ]
        },
        en: {
          title: 'Instant Geometry',
          heroTitle: 'Learn, draw, and build problems.',
          heroLead: 'Instant Geometry organizes concept pages, mathematical drawing pages, and problem-building pages by user intent.',
          learn: 'Learn',
          draw: 'Draw',
          problems: 'Problems',
          aria: 'Primary navigation',
          cards: [
            ['Learn', 'Definitions, properties, theorems, formulas, conditions, examples, cautions, and proofs.'],
            ['Draw', 'Geometry drawing, function drawing, graphing, construction, label adjustment, and saving.'],
            ['Problems', 'Entrance-exam problems, complex figures, area decomposition, conditional prompts, and explanations.']
          ]
        },
        zh: {
          title: 'Instant Geometry',
          heroTitle: '学习、绘制、制作问题。',
          heroLead: 'Instant Geometry 按用户目的整理概念学习、数学绘图和问题制作页面。',
          learn: '体系学习',
          draw: '数学绘图',
          problems: '问题制作',
          aria: '主要导航',
          cards: [
            ['体系学习', '整理定义、性质、定理、公式、条件、典型例、注意点和证明。'],
            ['数学绘图', '处理几何绘图、函数绘图、图表、作图、标签调整和保存。'],
            ['问题制作', '整理考试题、复杂图形、面积分解、条件出题和解说生成。']
          ]
        },
        es: {
          title: 'Instant Geometry',
          heroTitle: 'Aprende, dibuja y crea problemas.',
          heroLead: 'Instant Geometry organiza páginas de aprendizaje, dibujo matemático y creación de problemas según la intención del usuario.',
          learn: 'Aprender',
          draw: 'Dibujar',
          problems: 'Problemas',
          aria: 'Navegación principal',
          cards: [
            ['Aprender', 'Definiciones, propiedades, teoremas, fórmulas, condiciones, ejemplos, notas y pruebas.'],
            ['Dibujar', 'Dibujo geométrico, funciones, gráficas, construcción, etiquetas y guardado.'],
            ['Problemas', 'Problemas de examen, figuras complejas, descomposición de áreas, condiciones y explicaciones.']
          ]
        }
      };

      function getLang() {
        if (window.siteI18n && typeof window.siteI18n.getLanguage === 'function') {
          return window.siteI18n.getLanguage();
        }
        return document.documentElement.lang || 'ja';
      }

      function applyHomeTranslations() {
        const t = translations[getLang()] || translations.ja;
        document.title = t.title;
        const h1 = document.querySelector('.hero h1');
        const lead = document.querySelector('.lead');
        const learnLink = document.querySelector('.actions .primary');
        const drawLink = document.querySelector('.actions .function');
        const problemsLink = document.querySelector('.actions .pricing');
        const grid = document.querySelector('.grid');
        if (h1) h1.textContent = t.heroTitle;
        if (lead) lead.textContent = t.heroLead;
        if (learnLink) learnLink.textContent = t.learn;
        if (drawLink) drawLink.textContent = t.draw;
        if (problemsLink) problemsLink.textContent = t.problems;
        if (grid) grid.setAttribute('aria-label', t.aria);
        document.querySelectorAll('.card').forEach(function (card, index) {
          const data = t.cards[index];
          if (!data) return;
          const strong = card.querySelector('strong');
          const span = card.querySelector('span');
          if (strong) strong.textContent = data[0];
          if (span) span.textContent = data[1];
        });
      }

      document.addEventListener('site-components:ready', applyHomeTranslations);
      document.addEventListener('site-language:changed', applyHomeTranslations);
      applyHomeTranslations();
    })();
  </script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
