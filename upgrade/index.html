<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支援プラン</title>
  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      margin:0;
      background:#f6f7fb;
      color:#1f2430;
    }
    .wrap{
      max-width:760px;
      margin:40px auto;
      padding:24px;
    }
    .card{
      background:#fff;
      border:1px solid #d9dce7;
      border-radius:16px;
      padding:24px;
      box-shadow:0 4px 20px rgba(0,0,0,.04);
    }
    h1{margin:0 0 12px}
    p{line-height:1.7}
    ul{line-height:1.8}
    .price{
      font-size:28px;
      font-weight:700;
      margin:16px 0;
    }
    .buttons{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:20px;
    }
    button,a.btn{
      display:inline-block;
      text-decoration:none;
      border:1px solid #2a5bd7;
      background:#2a5bd7;
      color:#fff;
      padding:12px 16px;
      border-radius:10px;
      font-size:15px;
      cursor:pointer;
    }
    a.btn.secondary{
      background:#fff;
      color:#2a5bd7;
    }
    .note{
      color:#687086;
      font-size:14px;
      margin-top:10px;
    }
  </style>
  <link rel="stylesheet" href="/assets/base.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>InstantGeometry 支援プラン</h1>
      <p>
        InstantGeometry は、できるだけ無料で使える教育ツールとして運営しています。
        サーバー費用や機能改善を継続するため、支援プランへの参加をお願いしています。
      </p>

      <div class="price" id="priceBox">読み込み中...</div>

      <ul>
        <li>保存・PDF出力の制限なく利用できます</li>
        <li>今後の追加機能も利用しやすくなります</li>
        <li>教育ツールとしての継続運営を支えられます</li>
      </ul>

      <div class="buttons">
        <button id="proButton">支援プランに参加する</button>
        <a class="btn secondary" href="/">戻る</a>
      </div>

      <div class="note">
        表示価格は税込です。決済はStripeで安全に処理されます。
        <a href="/terms/">利用規約</a>・<a href="/legal/tokusho/">特定商取引法に基づく表記</a>をご確認のうえお申し込みください。
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/supabase-client.js"></script>

<script>
  async function loadPricing() {
    try {
      const res = await fetch('/api/get-pricing');
      const data = await res.json();

      if (!res.ok) {
        document.getElementById('priceBox').textContent = '料金の取得に失敗しました';
        return;
      }

      document.getElementById('priceBox').textContent =
        '月額 ' + data.amount + '円';
    } catch (e) {
      document.getElementById('priceBox').textContent = '料金の取得に失敗しました';
    }
  }

  document.getElementById('proButton').onclick = async () => {
    try {
      const { data, error } = await supabaseClient.auth.getSession();

      if (error || !data.session) {
        location.href = '/login/';
        return;
      }

      const res = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + data.session.access_token,
          'Content-Type': 'application/json'
        }
      });

      const json = await res.json();

      if (!res.ok) {
        alert(json.error || '決済ページの作成に失敗しました');
        return;
      }

      location.href = json.url;
    } catch (e) {
      alert(e.message);
    }
  };

  loadPricing();
</script>
  <div id="site-footer"></div>
  <script src="/assets/components.js"></script>
  <script src="/assets/site-auto-i18n.js"></script>
</body>
</html>
